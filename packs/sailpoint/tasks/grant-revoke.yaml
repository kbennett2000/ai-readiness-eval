id: grant-revoke
category: daily-automation
job_category: revoke-access
prompt: >
  Programmatically grant a role to a user, and separately revoke a role from a user, in ISC.
  What API calls do I make?
ground_truth:
  endpoints:
    - method: POST
      path: /v3/access-requests
      api_version: v3
      operation_id: createAccessRequest
      spec_ref: { file: idn/v3/paths/access-requests.yaml, operation_id: createAccessRequest }
  auth_flow: OAuth2 bearer token (see auth-token).
  required_scopes:
    - "idn:access-request:manage        # ORG_ADMIN / manager"
    - "idn:access-request-self:manage   # USER-level self grant"
  key_parameters:
    - { name: requestType, in: body, required: true, note: "GRANT_ACCESS or REVOKE_ACCESS — this field is what distinguishes grant from revoke" }
    - { name: requestedFor, in: body, required: true, note: "identity IDs (REVOKE_ACCESS: exactly one identity)" }
    - { name: requestedItems, in: body, required: true, note: "{ type: ROLE|ACCESS_PROFILE|ENTITLEMENT, id, operation: Add }" }
    - { name: removeDate, in: body, required: false, note: "sunset date-time for the assignment" }
  success_shape: "202 Accepted (asynchronous), same as access-request."
  common_failure_modes:
    - "Looking for a dedicated /grant or /revoke endpoint — there isn't one; use requestType."
    - "REVOKE_ACCESS attempted for multiple identities (only one allowed) or as a self-request (not supported)."
    - "Revoking access granted by role membership or birthright provisioning — not permitted via access request."
    - "Revoke of entitlements limited to 1 entitlement per request."
notes: >
  VERSION/SHAPE FINDING: there is NO dedicated grant or revoke endpoint. Both operations are the
  same createAccessRequest call, differentiated only by requestType (GRANT_ACCESS vs
  REVOKE_ACCESS). REVOKE_ACCESS has stricter rules than GRANT_ACCESS (single identity, no self
  request, cannot revoke role-membership/birthright access, 1 entitlement max) — all documented in
  the access-requests.yaml operation description at the pinned SHA.
