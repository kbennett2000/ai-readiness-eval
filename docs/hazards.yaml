# The hazard registry — every recorded way this project's instruments can mislead.
#
# WHY THIS FILE EXISTS (ADR-0015)
#   A hazard recorded in an ADR is recorded once and then buried in the ADR that found it.
#   ADR-0011 named the decay mode in its own words: "Left there, 'recorded as open work' is a
#   note that decays." It decayed twice at measurable cost — ADR-0014 repaired a failure the
#   previous cycle's card had predicted in writing and left unfixed, and ADR-0013 found a
#   dimension reported at 13.7% when the model was right in 98% of runs.
#
#   So every hazard here must declare one of two things, and `core/tests/test_hazards.py`
#   fails if it declares neither.
#
# VOCABULARY — the distinction this file exists to hold
#   gated        A test fires that prevents the hazard from occurring, or from regressing
#                silently. `gated_by` names it, and the test must exist on disk.
#   ungated      No such test. `ungated_reason` says why, `fix_queued_to` says where the fix
#                is queued (including "not queued", said plainly).
#   drift_pin    OPTIONAL, and ONLY on an ungated entry. A test that fires if the hazard's
#                *state* is changed, while the hazard itself stays live. ADR-0011's OAuth
#                example is the type case: the pin makes editing it a deliberate re-baseline;
#                it does not remove the bias. A drift pin NEVER satisfies the gated
#                requirement, and a test asserts that it cannot.
#
# SCOPE
#   Included: recorded ways a measurement, gate, or control of this project can be wrong,
#   blind, or silently misleading. Excluded: feature backlog — ADR-0004's richer cross-vendor
#   views and ADR-0006's `cmd_run` refactor are deferred work, not hazards, and are not here.
#
# HOW IT GROWS
#   By ADR, not ad hoc — the same rule as `core/taxonomy.py`. An ADR that records no hazard is
#   listed in `adrs_with_no_recorded_hazard` rather than simply omitted, so a new ADR forces a
#   decision instead of silently adding a blind spot.
#
# WHAT IT CANNOT DO
#   It lists hazards somebody wrote down. An unrecognized hazard is still invisible here. This
#   is a decay gate, not a discovery method.

version: 1

# Every ADR on disk is accounted for by at least one entry below, so this list is empty.
adrs_with_no_recorded_hazard: []

entries:

  # ---------------------------------------------------------------- ADR-0001 / ADR-0002 ---

  - id: privacy-check-is-a-manual-pre-push-grep
    adr: adr-0001-purpose-and-core-pack-architecture.md
    hazard: >
      The rule that business material never reaches a tracked file is enforced by a human
      running `git ls-files | grep -i private` before each push. Nothing fails if it is
      skipped, and the failure mode is unrecoverable once pushed.
    status: ungated
    ungated_reason: >
      A test could assert that no tracked path matches, but the real hazard is content
      quoted out of a private file into an ADR or commit message, which no path check sees.
      The weaker check was never written because it would read as coverage it does not give.
    fix_queued_to: >
      Not queued. A path-level check is cheap and would close half of it; the half it cannot
      close is the half that matters, which is why it has not been treated as a win.

  - id: vendor-guard-is-a-token-grep-not-a-semantic-check
    adr: adr-0001-purpose-and-core-pack-architecture.md
    hazard: >
      "core/ is vendor-agnostic" is enforced by grepping for a fixed list of vendor tokens. A
      vendor assumption expressed without any listed token — a hardcoded path shape, a task
      count, an auth style assumed universal — passes the guard.
    status: ungated
    ungated_reason: >
      A grep cannot check semantics. The guard proves the absence of names, not the absence
      of coupling.
    fix_queued_to: >
      Not queued. Mitigated in review, and by keeping vendor specifics reachable only through
      a loaded Pack so coupling has to be written deliberately to exist at all.
    drift_pin:
      - core/tests/test_core_no_vendor.py::test_guard_regex_actually_matches_known_vendor_tokens

  - id: unpinned-model-makes-runs-incomparable
    adr: adr-0001-purpose-and-core-pack-architecture.md
    hazard: >
      A grid run against an unpinned model alias silently measures whatever the alias resolved
      to that day, and its numbers cannot be compared to any other condition.
    status: gated
    gated_by:
      - core/tests/test_run_guard.py::test_unpinned_cli_run_is_blocked

  - id: provenance-class-is-invisible-to-the-regression-gate
    adr: adr-0002-extraction-and-regression-gate.md
    hazard: >
      The frozen-table gate asserts byte identity everywhere except a documented
      run-provenance class (`cli_policy`, `tool_discipline_summary`, `reused_runs` /
      `rebuilt_from_runs`). A change whose whole effect lands inside that class is invisible
      to the gate.
    status: ungated
    ungated_reason: >
      Deliberate. Those keys legitimately differ between an original run and an offline
      rebuild, so requiring byte identity there would make the gate unrunnable.
    fix_queued_to: >
      Not queued. The class is bounded rather than compared, which is the trade accepted when
      the gate was written.
    drift_pin:
      - packs/sailpoint/tests/test_regression_gate.py::test_metadata_diff_is_only_the_provenance_class

  - id: rebuild-report-on-fixtures-defeats-the-regression-gate
    adr: adr-0014-answer-format-repair.md
    hazard: >
      Regenerating the frozen fixtures with `rebuild-report` drops the run-provenance
      metadata and the tool-discipline line the gate's own assertions read, which would leave
      the gate comparing a rebuild to a rebuild forever — green, and measuring nothing.
    status: gated
    gated_by:
      - packs/sailpoint/tests/test_regression_gate.py::test_metadata_diff_is_only_the_provenance_class
      - packs/sailpoint/tests/test_regression_gate.py::test_summary_diff_is_only_the_tool_discipline_note

  - id: live-context-layer-rerun-is-out-of-scope-for-the-equivalence-claim
    adr: adr-0002-extraction-and-regression-gate.md
    hazard: >
      The third condition's frozen headline is reproducible only by re-scoring archived
      transcripts offline. The live server is external and is never started, so that number
      has never been re-verified end to end against a running layer.
    status: ungated
    ungated_reason: >
      Deliberate scope boundary. Vendoring the external server to make a live re-run possible
      was rejected as out of proportion to what it would prove.
    fix_queued_to: >
      Not queued. The claim the gate makes is extraction equivalence, and it is stated as
      that rather than as reproducibility of the original run.

  - id: answer-block-contract-assumes-a-rest-shaped-task
    adr: adr-0002-extraction-and-regression-gate.md
    hazard: >
      The six scored dimensions presuppose a REST-shaped readiness task. A vendor whose
      readiness is not API-shaped cannot be measured by this contract, and nothing detects
      that before a pack is authored against it.
    status: ungated
    ungated_reason: >
      The contract is the method, not a pack setting. Detecting "this vendor does not fit"
      mechanically would require a second contract to compare against.
    fix_queued_to: >
      A new ADR, not a pack. Recorded in ADR-0002 as an explicit boundary of the method.

  # ------------------------------------------------------------------------- ADR-0003/4 ---

  - id: per-task-scores-are-not-cross-vendor-comparable
    adr: adr-0003-job-taxonomy.md
    hazard: >
      Tasks are product-native by design, so one vendor's per-task number means something
      different from another's. Nothing prevents a reader — or a future renderer — from
      putting two per-task figures side by side.
    status: ungated
    ungated_reason: >
      The rule is about how numbers are read, and the committed artifacts contain both the
      per-task and the per-category view. Code cannot tell which one a reader is comparing.
    fix_queued_to: >
      Not queued. Enforced by convention: cross-vendor comparison happens only at category
      level, and the renderer emits only category rollups.

  - id: taxonomy-was-derived-from-one-pack
    adr: adr-0003-job-taxonomy.md
    hazard: >
      The category set was derived from the reference pack's eleven tasks and asserted to fit
      any enterprise identity product. A vendor whose surface does not decompose this way gets
      forced into a category or marked N/A.
    status: ungated
    ungated_reason: >
      Generality cannot be tested without the vendors that would disprove it. Every pack added
      is evidence either way, and N/A is a first-class recorded outcome rather than a fudge.
    fix_queued_to: >
      Not queued as code. The set grows only by amending ADR-0003, so widening it is a visible
      decision rather than a drift.

  - id: category-rollup-is-a-mean-of-means
    adr: adr-0004-category-cross-vendor-comparison.md
    hazard: >
      Where a vendor maps several tasks to one category, that category's number is the mean of
      the tasks' means — raw runs are not re-pooled, so tasks with different run counts weigh
      equally.
    status: ungated
    ungated_reason: >
      Coarse by design, and stated as such. The consumable committed artifact is each pack's
      aggregate, not its raw runs, so re-pooling would require the renderer to reach past the
      published artifact.
    fix_queued_to: >
      Not queued. Would need an ADR, because it changes what a published category number means.

  - id: nothing-stops-a-caller-mixing-conditions-in-one-table
    adr: adr-0004-category-cross-vendor-comparison.md
    hazard: >
      The cross-vendor renderer takes one labeled rollup per source and cannot know which
      condition each represents. A table mixing a cold column with a documented one would
      render cleanly and read as like-for-like.
    status: ungated
    ungated_reason: >
      Deliberate: keeping the renderer free of condition assumptions is what lets a
      two-condition pack and a three-condition pack appear in the same table at all.
    fix_queued_to: >
      Not queued. The caller labels each column and the label is what a reader checks.

  # --------------------------------------------------------------------- ADR-0005/7/9 ----

  - id: unfetchable-docs-are-indistinguishable-from-a-zero-lift
    adr: adr-0005-public-docs-fetch-fidelity.md
    hazard: >
      An un-fetchable page injects nothing, so the documented condition scores as if the docs
      did not help. A zero lift caused by our fetcher and a zero lift caused by the vendor's
      documentation produce the same headline number.
    status: ungated
    ungated_reason: >
      The distinction lives in the committed manifest (`fetch_error`, `byte_size`), not in the
      score. Refusing to run the grid instead would suppress the finding the method exists to
      make.
    fix_queued_to: >
      Not queued as a gate. ADR-0007 and ADR-0009 each closed one instance where our client,
      not the vendor, caused the zero; the general case is answered by reading the manifest.

  - id: a-page-that-claims-content-but-has-no-snapshot
    adr: adr-0005-public-docs-fetch-fidelity.md
    hazard: >
      Forgetting to fetch would otherwise look identical to a vendor whose pages are all
      un-fetchable — every page injects nothing, and the grid runs anyway.
    status: gated
    gated_by:
      - core/tests/test_public_docs_condition.py::test_missing_cache_raises
      - core/tests/test_public_docs_condition.py::test_unfetchable_page_injects_nothing_not_error

  - id: a-browser-user-agent-hides-the-bot-gate-it-was-added-for
    adr: adr-0007-docs-fetch-user-agent.md
    hazard: >
      A docs host that serves browsers and refuses self-identifying readers is itself a
      finding. A fetcher that always presented as a browser would never surface it, so the
      override that makes such a vendor measurable also destroys the signal if it becomes the
      default.
    status: gated
    gated_by:
      - core/tests/test_docs_fetch.py::test_default_user_agent_is_the_self_identifying_one
      - core/tests/test_docs_fetch.py::test_user_agent_override_is_used_and_recorded

  - id: no-prior-pack-affected-was-a-one-time-manual-recheck
    adr: adr-0007-docs-fetch-user-agent.md
    hazard: >
      The claim that no already-published finding changed when the User-Agent override landed
      rests on a manual re-fetch of every committed manifest URL under both agents, done once.
      Nothing re-runs it.
    status: ungated
    ungated_reason: >
      Re-running it means live network calls against vendor docs hosts on every suite run,
      which the method deliberately does not do.
    fix_queued_to: >
      Not queued. The manifest records which agent produced each snapshot, so the check is
      repeatable by hand from the committed record.

  - id: retry-floor-is-calibrated-against-one-host
    adr: adr-0009-throttled-docs-fetch.md
    hazard: >
      The throttle backoff was measured against a single live host. A host with a longer
      penalty window still exhausts its retries and records a fetch error, which then reads as
      a fact about that vendor's documentation.
    status: ungated
    ungated_reason: >
      Calibration needs the host. A guessed floor would trade one silent misclassification
      for another, which is the reason a minimum-length heuristic was also refused.
    fix_queued_to: >
      Not queued. A pack declares its own `fetch_delay_seconds`, so a newly met host is
      accommodated by config and its recon ADR says what the host does.

  - id: a-near-empty-page-still-counts-as-a-page
    adr: adr-0009-throttled-docs-fetch.md
    hazard: >
      The empty-body check tests the raw body, not the extracted text. An HTML shell that
      renders its content with JavaScript hashes cleanly and is recorded as a real snapshot of
      a page that contains almost nothing.
    status: gated
    gated_by:
      - core/tests/test_docs_fetch.py::test_a_page_that_renders_to_a_nav_crumb_is_an_error_not_a_snapshot
      - core/tests/test_docs_fetch.py::test_the_floor_is_a_floor_and_not_a_haircut

  - id: a-2xx-with-an-empty-body-recorded-as-a-clean-fetch
    adr: adr-0009-throttled-docs-fetch.md
    hazard: >
      A host that throttles automated readers with a success status and no body would be
      recorded with a valid hash and a byte size, asserting a clean fetch of an empty
      document — a failure that leaves no trace in the committed record.
    status: gated
    gated_by:
      - core/tests/test_docs_fetch.py::test_empty_body_on_a_success_status_is_an_error_not_a_snapshot
      - core/tests/test_docs_fetch.py::test_throttled_page_is_retried_then_recorded_as_an_error

  # ------------------------------------------------------------------------ ADR-0006 -----

  - id: machine-invented-ground-truth
    adr: adr-0006-factory-dispatcher.md
    hazard: >
      The cardinal failure: a model asked to author a pack would fabricate exactly the answer
      key it is then scored against. Every dimension would read high and measure nothing.
    status: gated
    gated_by:
      - core/tests/test_factory.py::test_anchoring_blocks_on_an_unresolvable_spec_ref
      - core/tests/test_factory.py::test_recon_blocks_when_spec_claimed_but_not_vendored

  - id: validation-catches-shape-not-correctness
    adr: adr-0006-factory-dispatcher.md
    hazard: >
      A pack can be schema-valid, fully anchored, and round-trip clean while its ground truth
      is wrong. Every automated gate in the pipeline checks form; none checks fact.
    status: ungated
    ungated_reason: >
      Only a human reading the vendor's source establishes that a key is right. Anchoring
      proves it is traceable and round-trip proves it is scoreable; neither proves it is true.
    fix_queued_to: >
      Auto-authoring is deferred to its own cycle, revisited only once several packs exist as
      patterns. Until then an un-authored target blocks with a written reason.

  - id: sterility-canary-is-skipped-on-resumed-conditions
    adr: adr-0006-factory-dispatcher.md
    hazard: >
      The canary proves sterility once per pipeline; a resumed condition skips it. A run that
      resumes into a differently-configured environment is not re-proved sterile.
    status: ungated
    ungated_reason: >
      Re-running the canary per resume costs model spend on every interruption, which is the
      cost the resumable runner exists to avoid.
    fix_queued_to: >
      Not queued. Recorded in ADR-0006 as a documented skip.

  - id: prospect-name-leaks-into-the-public-repo
    adr: adr-0006-factory-dispatcher.md
    hazard: >
      A measured prospect's name reaching this repository is not walk-backable once pushed.
      The original guard read tracked file CONTENT only, and cycle 12 found the obvious second
      route already taken: a `cycle-NN-<vendor>` branch had been pushed, publishing the name on
      a world-visible ref while the guard stayed green — a ref is neither a file nor tracked.
      Both routes are now scanned. A third remains open and ungated below.
    status: gated
    gated_by:
      - core/tests/test_core_no_vendor.py::test_public_repo_names_no_prospect
      - core/tests/test_core_no_vendor.py::test_public_repo_ref_names_no_prospect

  - id: a-mock-answer-can-be-resumed-into-a-real-grid
    adr: adr-0006-factory-dispatcher.md
    hazard: >
      `run --mock` writes its per-condition runs into the SAME date-stamped results directory a
      real grid uses — only the mock *preflight* gets a directory of its own — and the runner is
      resumable. So the dry-run sequence this project's own README documents (`factory next
      --provider mock`, then `factory next --model <id>` on the same day) resumed straight off the
      mock answers, counted them as measured, and wrote a metadata block naming the real model and
      a real spend. Publishing a mock number as a vendor's result is the worst failure available to
      this harness, and it sat on the documented happy path.
    status: gated
    gated_by:
      - core/tests/test_run_provenance.py::test_a_mock_archive_is_refused_by_a_real_run
      - core/tests/test_run_provenance.py::test_a_real_archive_is_refused_by_a_mock_run
      - core/tests/test_run_provenance.py::test_a_disciplined_mock_archive_is_still_refused_by_a_real_run
      - core/tests/test_run_provenance.py::test_a_mock_run_stamps_every_archived_run
      - core/tests/test_run_provenance.py::test_a_second_mock_run_still_resumes

  - id: run-provenance-is-recorded-only-as-an-absence
    adr: adr-0006-factory-dispatcher.md
    hazard: >
      The guard above reads a `mock: true` stamp, and treats its ABSENCE as "this was a real run".
      That is what absence means for every archive written before the stamp existed, which is why
      it was chosen — the alternative invalidates every committed result and forces a full re-burn.
      But it means the guard protects against a mock archive mislabelled as real, and not against
      any other provenance mismatch: a run archived under a different model, a different prompt
      contract, or a different scorer version is still reused without comment.
    status: ungated
    ungated_reason: >
      A full provenance hash over model, prompt and scorer would catch the general case, but it
      would also invalidate every archive in the cohort the moment any of the three changed —
      which is precisely what `rebuild-report` exists to avoid, since re-scoring archives offline
      at zero model spend is how three previous cycles corrected published numbers.
    fix_queued_to: >
      Not queued as a hash. The mitigation that already exists is that a deliberate cohort
      re-baseline re-runs everything anyway, and the model is recorded in each condition's
      metadata where a reader can see it.

  - id: prospect-name-leaks-where-no-test-can-read
    adr: adr-0006-factory-dispatcher.md
    hazard: >
      A PR title, a PR body, an issue title, an issue body and a commit message are all
      world-visible and none of them is a file in the tree, so no test in this repository can
      read any of them. The privacy rule they are subject to is identical to the one two tests
      now enforce over files and refs; the enforcement is not.
    status: ungated
    ungated_reason: >
      Checking them means calling the GitHub API from the suite, which would make an offline or
      unauthenticated run fail for a reason unrelated to the tree. A commit-message check could
      run locally, but it would cover the one surface of the five that is cheapest to amend and
      leave the four that are not — coverage that reads stronger than it is.
    fix_queued_to: >
      Not queued. The mitigation is procedural and stated in the cycle report: public PR and
      issue text describes a measured vendor as "the next queued target" and never names it. A
      pre-push hook over commit messages is the cheapest real improvement if this recurs.

  - id: the-prospect-token-list-can-omit-a-prospect
    adr: adr-0018-prospect-names-live-outside-this-repo.md
    hazard: >
      A leak guard only catches a name its list already holds. While that list was hand-written
      here, a target could enter the private queue and simply never be added — the guards report
      green and the name is unprotected. It happened: the list went stale between cycles 2 and 6
      and a recon note naming two later prospects reached a commit before the guard objected.
      The list is now DERIVED from the private queue plus the pack directories (ADR-0018), so
      the same edit that adds a target adds its tokens and forgetting is no longer possible.
      Deriving also widened coverage from the eight names someone had remembered to type to
      every target in the queue, including ten that had never been guarded at all.
    status: gated
    gated_by:
      - core/tests/test_core_no_vendor.py::test_prospect_tokens_are_derived_from_the_private_queue
      - core/tests/test_core_no_vendor.py::test_prospect_regex_actually_matches_every_token_it_claims

  - id: the-leak-guard-is-silent-where-the-private-repo-is-absent
    adr: adr-0018-prospect-names-live-outside-this-repo.md
    hazard: >
      The residue of ADR-0018, and the price it paid. Because the name list now lives outside
      this repository, the guard SKIPS wherever `AIRE_PACKS_DIR` is unset — an outside clone, a
      fresh CI runner, a container that lost its environment. The suite then reports green with
      its privacy guard never having run, and green is exactly what a reader takes as proof the
      rule held. The old design could not fail this way; it could only disclose. This is the
      trade that was made knowingly, not an oversight.
    status: ungated
    ungated_reason: >
      Failing instead of skipping would break every outside clone of a public repository for a
      reason unrelated to its own tree, which is a worse outcome than a visible skip. The
      halfway measures are already taken and do not close it: a misconfigured source FAILS
      rather than skips, a source yielding zero names FAILS rather than passing green, and the
      skip message names the variable and the reason. What remains uncovered is nobody being
      forced to read it.
    fix_queued_to: >
      Not queued, in ADR-0016's "considered and declined" sense rather than the undecided one.
      The real fix is environmental, not code: set `AIRE_PACKS_DIR` wherever this suite is run
      by anyone who owns the private repo. If this project ever gains CI, requiring the variable
      there — and failing without it — is the cheapest real improvement, because a CI runner has
      no legitimate reason to be missing it.

  - id: prospect-names-remain-in-this-repository-git-history
    adr: adr-0018-prospect-names-live-outside-this-repo.md
    hazard: >
      ADR-0018 removes every prospect name from tracked files at HEAD. It does not and cannot
      remove them from history. The names sat in the leak guard from cycle 2 and a further five
      were merged in cycle 13, so `git log -p`, GitHub's commit and pull-request diff views, and
      every existing clone, fork or mirror still carry the full list. The fix is real but it is
      forward-looking only: it stops the next name landing, it does not retract the last one.
    status: ungated
    ungated_reason: >
      No test over a working tree can assert anything about history, and the only remedy is a
      history rewrite — explicitly a blocker-class action under CLAUDE.md, destructive, and
      incomplete even if performed: it would not clear merged pull-request diffs, issue bodies,
      GitHub's search index, or any fork. Doing it would trade a certain, large cost for a
      partial reduction in an exposure that is already public.
    fix_queued_to: >
      Issue kbennett2000/ai-readiness-eval#24, which records the recommendation NOT to rewrite
      and states what a complete remedy would actually cost (deleting and recreating the
      repository, losing every issue and pull request). That is an operator decision about
      accepted risk, not a cycle's to take.

  - id: the-leak-scan-excludes-imported-evidence-archives
    adr: adr-0018-prospect-names-live-outside-this-repo.md
    hazard: >
      The leak scan skips `packs/*/fixtures/imported/` (except the hand-written PROVENANCE.md).
      An exempt region is exactly how the previous guard failed — it excused one file, and that
      file became the roster — so the shape is worth naming even though the reasoning differs.
      A prospect's name sitting inside a frozen transcript would not be reported. The exclusion
      was forced rather than chosen: widening the token list to the whole queue immediately
      failed on a measured model naming a third-party product inside an example JSON payload,
      and those archives are the evidence a published number rests on, so redacting one to
      satisfy a guard is the repair this project must never make.
    status: gated
    gated_by:
      - core/tests/test_core_no_vendor.py::test_the_archive_exclusion_covers_archives_and_nothing_else
      - core/tests/test_core_no_vendor.py::test_the_guard_does_not_exempt_its_own_file

  # ------------------------------------------------------------------------ ADR-0019 -----

  - id: a-known-status-is-not-an-appropriate-one
    adr: adr-0019-parked-is-a-status-not-a-synonym.md
    hazard: >
      `load_queue` now rejects a status outside the declared vocabulary, which closes the trap
      that an unrecognized value read as "dispatch this next" — the trap `parked` walked into
      while it was only prose in a comment. What the check cannot do is judge whether a known
      status is the RIGHT one. Nothing stops an author marking an unmeasured target `carded`,
      or recording a deliberate deferral as `blocked` — which would file our own judgement under
      the target's shortcomings, the distinction ADR-0019 exists to keep. A parked target's
      reason is free text, so the quality of that record rests entirely on its author.
    status: ungated
    ungated_reason: >
      A vocabulary check is syntactic by construction. Whether a target deserves the status it
      carries is a claim about the world, and the gates — not the status field — are what make
      `carded` mean something; a test that tried to infer intent from a queue file would be
      guessing. The one mechanical half IS covered: every status the code can produce is proven
      loadable, so the vocabulary and the pipeline cannot drift apart.
    fix_queued_to: >
      Not queued, in ADR-0016's "not closable" sense. The nearest real improvement is a check
      that a `carded` entry has a card on disk, which belongs in the private packs repo where
      the cards are — the public engine cannot see them.

  # ------------------------------------------------------------------------ ADR-0008 -----

  - id: api-version-has-no-sanctioned-empty-spelling
    adr: adr-0008-unversioned-apis.md
    hazard: >
      The contract shows how to say "no scopes" and does not show how to say "no version". A
      model that correctly identifies an unversioned API has no sanctioned way to write it,
      so some will still answer a plausible-looking version.
    status: ungated
    ungated_reason: >
      The scorer now accepts every spelling of the empty version, but the contract itself
      still does not offer one. Fixing the contract changes what the model was asked, so it
      cannot be re-applied to archived transcripts and would break comparability with every
      grid already run.
    fix_queued_to: >
      The next deliberate cohort re-baseline — the same trigger as
      `prompt-contract-offers-one-login-style` and `prompt-contract-teaches-the-flow-list-style`.
      All three are prompt changes and must move together.

  - id: unversioned-api-version-is-not-cross-vendor-averageable
    adr: adr-0008-unversioned-apis.md
    hazard: >
      For an unversioned vendor the version dimension measures "correctly reported the absence
      of a version"; for a versioned one it measures "picked the right version". Averaging the
      two into one cross-vendor figure silently mixes two questions.
    status: ungated
    ungated_reason: >
      The scorer cannot know which question a reader is asking of the number, and both are
      legitimate dimensions to publish.
    fix_queued_to: >
      Not queued. A pack in that position says so on its card rather than letting the two
      average into one claim.

  # ------------------------------------------------------------------------ ADR-0010 -----

  - id: roundtrip-cannot-detect-a-wrong-answer-key
    adr: adr-0010-ground-truth-round-trip-control.md
    hazard: >
      An answer key always matches itself. The round-trip control detects a key that cannot be
      scored and never one that is wrong — it would have passed the pack whose mistaken path
      prefix appeared identically on both sides of the comparison. Reading a green roundtrip
      as evidence that ground truth is correct is a misreading of the control.
    status: ungated
    ungated_reason: >
      Structural, and unfixable by this control. Catching a wrong key requires comparing it to
      something outside itself — the vendor's documentation — which is a human recon judgement.
    fix_queued_to: >
      Not queued as a code fix. Detection is the suspect-instrument rule from ADR-0008 plus
      reading transcripts, which is what caught ADR-0013 after the grid had already been paid
      for.

  - id: roundtrip-cannot-catch-the-harness-own-dialect
    adr: adr-0014-answer-format-repair.md
    hazard: >
      The harness renders ground truth as block sequences, so its own renderer can never
      produce the single-line flow sequence its parser was rejecting. A construct the harness
      accepts from itself but not from a model round-trips perfectly and is invisible to the
      control. This is the second named blind spot in the same control, and the third
      consecutive cycle in which one of them was the thing that mattered.
    status: ungated
    ungated_reason: >
      Structural, for the same reason as the wrong-key blind spot: a control that compares the
      harness to itself cannot see a dialect gap between the harness and a model.
    fix_queued_to: >
      Not queued. Closing it means round-tripping ground truth through every serialization the
      contract permits, not just the one the renderer emits.

  - id: key-parameters-with-no-required-flag-is-only-a-note
    adr: adr-0010-ground-truth-round-trip-control.md
    hazard: >
      A task whose parameter list marks nothing `required: true` scores n/a on that dimension.
      The control reports it as a non-blocking note, so a pack can publish with a dimension
      that was never actually tested.
    status: ungated
    ungated_reason: >
      ADR-0011 promoted the auth half of this same note to a blocking problem and left this
      half a note. n/a is a legitimate outcome for a task with genuinely no required
      parameter, so blocking on it would block every such pack.
    fix_queued_to: >
      Not queued anywhere, and this entry is the record of that. It is the closest live
      analogue to the gap ADR-0011 closed.

  - id: na-dimensions-are-excluded-from-the-perfection-requirement
    adr: adr-0010-ground-truth-round-trip-control.md
    hazard: >
      The round-trip gate requires every *applicable* dimension to score exactly 1.0. A
      dimension reading n/a is reported, not counted, so a key can pass the control while
      leaving dimensions untested.
    status: ungated
    ungated_reason: >
      Deliberate. Failing on n/a would block every pack with a scopeless or
      parameterless task, which are ordinary and legitimate shapes.
    fix_queued_to: >
      Not queued. The n/a dimensions are reported in the control's output, so the hole is
      visible per task rather than aggregated away.

  - id: gates-and-stages-can-drift
    adr: adr-0010-ground-truth-round-trip-control.md
    hazard: >
      The pipeline's stage list is documentation; the gate tuple is what runs. When the order
      was inlined in the dispatcher, a stage could exist in one and not the other — which had
      already happened once, with one gate spliced into a loop over the others.
    status: gated
    gated_by:
      - core/tests/test_factory.py::test_gates_are_declared_in_pipeline_order

  - id: an-unattended-gate-that-raises-crashes-without-a-reason
    adr: adr-0010-ground-truth-round-trip-control.md
    hazard: >
      The dispatcher's gate loop has no exception handling, and no human is watching the run.
      A gate that raises kills the cycle without recording why it stopped.
    status: gated
    gated_by:
      - core/tests/test_roundtrip.py::test_a_task_with_no_ground_truth_is_reported_not_raised
      - core/tests/test_roundtrip.py::test_check_pack_reports_unreadable_tasks
      - core/tests/test_roundtrip.py::test_a_malformed_ground_truth_is_reported_not_raised

  - id: editing-the-reference-pack-to-satisfy-a-gate
    adr: adr-0010-ground-truth-round-trip-control.md
    hazard: >
      A gate that can be satisfied by editing the thing it measures is not a gate. Editing the
      reference pack's ground truth is the one move that would silently shift the frozen
      anchor every other claim is checked against.
    status: gated
    gated_by:
      - packs/sailpoint/tests/test_regression_gate.py::test_overall_headline_reproduces
      - packs/sailpoint/tests/test_regression_gate.py::test_per_run_scores_are_byte_identical

  # ------------------------------------------------------------------------ ADR-0011 -----

  - id: scorer-cannot-read-a-negation
    adr: adr-0011-auth-login-styles.md
    hazard: >
      Ground truth stating "not an OAuth2 flow — there is no client_credentials grant" still
      contributes that concept to the extracted set. The precedence order rescues the known
      case; a future key that denies a higher-ranked style than the one it uses would be
      scored wrongly, and the ADR states plainly that no test on disk would catch it.
    status: ungated
    ungated_reason: >
      Substring extraction cannot parse negation. Reading it properly means understanding the
      prose, which is a different class of instrument than a deterministic scorer.
    fix_queued_to: >
      Not queued. Recorded in ADR-0011's "what this still cannot do" as a known live gap.

  - id: unlisted-login-style-scores-for-free
    adr: adr-0011-auth-login-styles.md
    hazard: >
      Before ADR-0011 the scorer knew two auth concepts. Ground truth naming neither scored
      1.0 against any answer that also named neither, so the dimension read as applicable
      while testing nothing — twenty of sixty-three tasks. A sixth login style would do the
      same again.
    status: gated
    gated_by:
      - core/tests/test_roundtrip.py::test_a_login_style_the_scorer_cannot_name_blocks_the_pack
      - core/tests/test_factory.py::test_roundtrip_gate_blocks_a_login_style_the_scorer_cannot_name

  - id: auth-markers-can-measure-our-phrasebook
    adr: adr-0011-auth-login-styles.md
    hazard: >
      The first draft of the login-style marker list matched exact phrases and scored zero on
      forty of one pack's fifty documented runs — every one of which named the mechanism
      correctly and differed only in wording. A marker list is itself an instrument, and a new
      rule's own output is the rule's suspect first.
    status: gated
    gated_by:
      - core/tests/test_scorer.py::test_real_answers_that_name_the_session_mechanism_are_credited
      - core/tests/test_scorer.py::test_bare_login_is_not_a_session_marker
      - core/tests/test_scorer.py::test_precedence_is_table_order_and_is_load_bearing

  - id: auth-flow-cannot-judge-whether-an-answer-understands-itself
    adr: adr-0011-auth-login-styles.md
    hazard: >
      An answer naming the right auth style for the wrong reason scores identically to one
      that understands it. The dimension measures naming, not comprehension.
    status: ungated
    ungated_reason: >
      Inherent to deterministic scoring, which is the property that makes this method
      reproducible at all. Judging reasoning would require a model in the scoring loop.
    fix_queued_to: >
      Not queued, and not intended to be. Recorded so the dimension is not read as more than
      it is.

  - id: prompt-contract-offers-one-login-style
    adr: adr-0011-auth-login-styles.md
    hazard: >
      The contract shows exactly one example for the auth field, naming one of five login
      styles the scorer knows. Every measured model has read it. That is a plain bias toward
      OAuth wording on products that do not use it, and it understates the absolute figure for
      a non-OAuth product.
    status: ungated
    ungated_reason: >
      Changing the example changes what the model was asked. Unlike a scorer rule it cannot be
      re-applied to archived transcripts, so it would make every previously measured vendor
      incomparable and require re-running the whole cohort.
    fix_queued_to: >
      The next deliberate cohort re-baseline, bundled with any model change — since a model
      change already forces the cohort to re-run together. Same trigger as
      `api-version-has-no-sanctioned-empty-spelling`.
    drift_pin:
      - core/tests/test_prompt_contract.py::test_the_auth_flow_example_is_pinned
      - core/tests/test_prompt_contract.py::test_the_contract_offers_exactly_one_login_style

  # ------------------------------------------------------------------------ ADR-0013 -----

  - id: wrong-base-address-notation-passes-the-anchoring-gate
    adr: adr-0013-spec-server-prefix.md
    hazard: >
      A spec may split an endpoint's address between its server URL and its path key wherever
      the spec author found convenient, and the vendor's documentation may draw the base URL
      somewhere else entirely. The gate now accepts a path written from any point inside the
      declared prefix — so an author who picks the notation the vendor's readers do not use
      still gets a green gate and a depressed score. This cost one grid an endpoint dimension
      reported at 13.7% when the model was right in 98% of runs.
    status: ungated
    ungated_reason: >
      Which notation is correct depends on where the vendor tells a developer the base URL
      ends, which is a recon judgement about documentation, not a property of the spec. The
      gate's job is to reject a path anchored to nothing; it deliberately does not pick among
      several equally-anchored notations.
    fix_queued_to: >
      Not queued. Detection is the suspect-instrument rule — an implausibly low dimension is
      the harness's fault until proven otherwise — plus reading the transcripts. The affected
      pack's card carries the before and after rather than only the corrected number.

  - id: a-path-anchored-to-nothing
    adr: adr-0013-spec-server-prefix.md
    hazard: >
      Widening the gate to accept several notations could have widened it into accepting a
      path that resolves to no operation at all, which is the fabricated-ground-truth failure
      the gate exists to stop.
    status: gated
    gated_by:
      - core/tests/test_factory.py::test_anchoring_still_blocks_a_path_that_matches_no_notation
      - core/tests/test_factory.py::test_a_spec_with_no_server_prefix_accepts_only_its_own_path

  # ------------------------------------------------------------------------ ADR-0014 -----

  - id: prompt-contract-teaches-the-flow-list-style
    adr: adr-0014-answer-format-repair.md
    hazard: >
      The contract's worked example writes its lists as a single-line flow sequence. A model
      copying that shape and naming an indexed API parameter inside it produces invalid YAML,
      and the parser discarded the entire answer — endpoint, method, version and auth along
      with the parameter list. The harness demonstrated the style and then punished a
      legitimate use of it.
    status: ungated
    ungated_reason: >
      ADR-0014 repaired the parser, which is re-appliable to archives. Rewriting the example
      as a block sequence would make the failure structurally impossible for every future run
      — the better permanent fix — but it changes what the model was asked, so it cannot be
      re-applied to archived transcripts and would break comparability with every grid already
      run.
    fix_queued_to: >
      The next deliberate cohort re-baseline. Same trigger as
      `prompt-contract-offers-one-login-style` and
      `api-version-has-no-sanctioned-empty-spelling`; the three are one change.
    # Pinned, not fixed: the contract still teaches the style. The pin only makes
    # changing the example a deliberate re-baseline rather than a silent edit,
    # which is why this entry stays ungated.
    drift_pin:
      - core/tests/test_prompt_contract.py::test_the_list_style_example_is_pinned

  - id: repair-split-can-manufacture-a-containment-score
    adr: adr-0014-answer-format-repair.md
    hazard: >
      Both dimensions the answer-format repair can reach are scored by containment, so
      splitting one item into several can only ever raise a score. A hedging answer written as
      one quoted string, split naively on its comma, yields two exact ground-truth names and
      scores 1.0 where the valid-YAML reading scores 0.0. The bias would be monotonically
      upward and would look like a result.
    status: gated
    gated_by:
      - core/tests/test_answer_block.py::test_a_comma_inside_a_quoted_item_is_never_split
      - core/tests/test_answer_block.py::test_a_quoted_scope_sentence_is_never_split
      - core/tests/test_answer_block.py::test_prose_items_are_not_repaired
      - core/tests/test_answer_block.py::test_an_unterminated_quote_abandons_the_repair
      - core/tests/test_answer_block.py::test_a_trailing_comment_containing_a_bracket_abandons_the_repair

  - id: other-malformed-answer-families-are-not-repaired
    adr: adr-0014-answer-format-repair.md
    hazard: >
      The repair covers one shape because that is the only shape in the corpus. A colon-space
      inside unquoted prose is the most plausible next candidate and would hit an
      always-applicable dimension, discarding whole answers the same way.
    status: ungated
    ungated_reason: >
      The tolerance is written against measured evidence — one failure family across the
      archived corpus — and no further. Widening it speculatively is how a repair becomes a
      score adjustment.
    fix_queued_to: >
      Deliberately not queued: it stays out of scope until a run actually produces it. ADR-0014
      records this as a boundary chosen rather than overlooked.
    drift_pin:
      - core/tests/test_answer_block.py::test_a_multiline_flow_sequence_is_out_of_scope
      - core/tests/test_answer_block.py::test_other_keys_are_out_of_scope
      - core/tests/test_answer_block.py::test_unrelated_yaml_damage_keeps_its_original_reason

  - id: the-frozen-headline-held-by-luck
    adr: adr-0014-answer-format-repair.md
    hazard: >
      The reference tables reproduced across ADR-0014 because the single rescued answer
      happened to score 6/6. Anything below roughly 0.917 would have moved a published figure
      by a point. "The anchor did not move" is a fact about this corpus, not a property of the
      change — and the regression gate reads as a stronger guarantee than it gave here.
    status: ungated
    ungated_reason: >
      No test can assert that a future parser or scorer change will leave the anchor unmoved;
      that is precisely what the gate is for, and the gate is allowed to fail.
    fix_queued_to: >
      Not queued. The honest response is that a moved anchor is a stop-and-record, never a
      re-baseline.
    drift_pin:
      - packs/sailpoint/tests/test_regression_gate.py::test_the_answer_format_repair_fires_exactly_once_in_this_corpus

  - id: format-failures-are-not-comparable-across-adr-0014
    adr: adr-0014-answer-format-repair.md
    hazard: >
      The metric's definition did not change but the instrument's tolerance did. A
      format-failure count from before the repair and one from after are different
      measurements, and nothing in the artifact says which side of the change it sits on.
    status: ungated
    ungated_reason: >
      A per-report provenance marker would have to be back-filled onto archives that predate
      it, which is the same class of retroactive edit the method avoids.
    fix_queued_to: >
      Not queued. Any cross-cycle reading of the number must state which side of ADR-0014 it
      is on; the repair counter being always present, including as zero, is what lets a reader
      tell a re-scored report from one that predates the counter.

  - id: stale-dimensions-cached-in-run-files
    adr: adr-0014-answer-format-repair.md
    hazard: >
      Re-scoring rewrites the aggregate and the summary only, so a re-scored archive's per-run
      files keep their pre-rebuild dimension values. Nothing reads them today; a future
      consumer that does would read numbers that were superseded without noticing.
    status: ungated
    ungated_reason: >
      Rewriting the per-run transcripts would edit the frozen evidence, which is the one thing
      a re-score must not touch. Fixing it properly means separating the raw response from the
      derived scores in the file format.
    fix_queued_to: >
      Follow-up work, no cycle assigned. ADR-0014 records it as a live trap rather than
      widening that cycle to fix it.

  # ------------------------------------------------------------------------ ADR-0015 -----

  - id: the-registry-only-lists-hazards-somebody-recognized
    adr: adr-0015-hazard-registry.md
    hazard: >
      This file lists what somebody wrote down. An unrecognized blind spot is exactly as
      invisible here as it was before, and a complete-looking registry invites being read as
      a complete list of what can go wrong — the same misreading as taking a green round-trip
      for proof that a key is right.
    status: ungated
    ungated_reason: >
      A gate cannot detect a hazard nobody has articulated. Mining ADR prose for hedging words
      and demanding a row per match was considered and rejected as too noisy to survive
      contact with real writing.
    fix_queued_to: >
      Not queued, and not closable. The registry is a decay gate, not a discovery method; the
      discovery method is still the suspect-instrument rule and reading transcripts.

  - id: the-registry-does-not-rank-hazards
    adr: adr-0015-hazard-registry.md
    hazard: >
      Thirty-one ungated hazards are listed flat, so a structural limit nobody can close sits
      beside a live trap with a known fix. A reader scanning for what matters most gets no
      help from the file.
    status: ungated
    ungated_reason: >
      Ranking them would invent an ordering no evidence supports. The two fields that decide
      whether a hazard needs attention — is anything watching it, and what is it waiting on —
      are already required of every entry.
    fix_queued_to: >
      Not queued. Revisit if the count grows past what a reader can hold, at which point
      grouping by trigger would be more honest than grading by severity.

  - id: repaired-runs-are-unmarked-in-the-invented-endpoint-exhibit
    adr: adr-0014-answer-format-repair.md
    hazard: >
      The invented-endpoint analysis skips format failures, so a run rescued by the repair now
      enters that exhibit's denominator without a marker. The exhibit's population changed
      silently across the change.
    status: ungated
    ungated_reason: >
      Low impact, and marking it means threading repair state into an analysis that currently
      reads only scored runs.
    fix_queued_to: >
      Follow-up work, no cycle assigned. Recorded alongside the stale-dimensions trap for the
      same reason.

  # ------------------------------------------------------------------------ ADR-0016 -----

  - id: triage-can-defer-a-real-instrument-fault-as-hygiene
    adr: adr-0016-deferred-work-has-a-destination.md
    hazard: >
      The standing rule sorts every observation into "affects a published number or a
      vendor-facing claim" (fix now) and "everything else" (file it), and the sort is made by an
      unattended run with no second opinion. A fault whose consequence is not yet visible in a
      number reads as hygiene. The two most expensive faults this project has found would BOTH
      have sorted as "file it" on the evidence available at the time: ADR-0013's endpoint
      dimension looked like a notation preference until a grid reported 13.7% for a model that
      was right in 98% of runs, and ADR-0014's format failure was written down as a prediction
      on a report card and left because it had not yet bitten.
    status: ungated
    ungated_reason: >
      No test can read an observation and decide whether it moves a number, because the
      observation is not a program input — it is whatever the run happened to notice. A gate
      here would either grade prose or fire on everything.
    fix_queued_to: >
      Not closable as a gate, and not queued as one. The mitigation is that a misfiled item is
      now filed rather than forgotten, so a triage error is recoverable at review time instead
      of decaying; the discovery method remains the suspect-instrument rule and reading
      transcripts.

  - id: a-queued-fix-is-a-link-nothing-resolves
    adr: adr-0016-deferred-work-has-a-destination.md
    hazard: >
      `fix_queued_to` is prose, and unlike `gated_by` it is never resolved against anything. An
      entry may cite an issue that was closed without the fix, renamed to something else, or
      never existed, and the registry will go on reporting the hazard as queued. This is the
      failure ADR-0015 built an `ast` resolver to prevent on the gated side, reappearing on the
      ungated side where nothing is watching.
    status: ungated
    ungated_reason: >
      Resolving an issue reference means a network call from the test suite, which would make an
      offline or rate-limited run fail for a reason unrelated to the tree. A shape check on
      `#\d+` would prove the text looks like a reference, not that the reference is live —
      coverage that reads stronger than it is, which this file exists to refuse.
    fix_queued_to: >
      Not queued. Revisit once entries actually cite issue numbers; a check that runs only when
      a reference token is present, and only where the network is available, is the shape it
      would take.

  # ------------------------------------------------------------------------ ADR-0017 -----

  - id: no-signal-when-a-pack-needs-a-base-prefix
    adr: adr-0017-endpoint-base-prefix.md
    hazard: >
      `endpoint_base_prefix` is opt-in, and nothing detects that a pack needs it. The condition is
      invisible until someone reads transcripts: the pack validates, anchors, and round-trips green,
      and the only symptom is a cold endpoint score far below the documented one — which reads as a
      large documentation lift, the exact result this project is looking for, so it is the least
      likely number to be questioned. It cost a grid here and a grid at ADR-0013.
    status: ungated
    ungated_reason: >
      A gate would have to decide that a gap between conditions is too large to be real, which is a
      judgement about the finding rather than about the instrument. Every threshold considered would
      either fire on the honest large gaps this method exists to find, or sit high enough to have
      missed this one.
    fix_queued_to: >
      Not queued as a gate. A cheaper non-gate is queued instead: report, per condition, how many
      unmatched answers would have matched under some single leading prefix, so the artifact shows up
      as a number in the run summary rather than waiting to be noticed. Filed to ai-readiness-eval.

  - id: a-declared-prefix-is-not-checked-against-the-vendor
    adr: adr-0017-endpoint-base-prefix.md
    hazard: >
      A pack declares the prefix itself, and nothing verifies the string names a real base URL for
      that vendor. A careless or over-broad declaration — a prefix that is actually a resource
      segment — would collapse a real distinction and raise the endpoint score for a wrong answer.
    status: ungated
    ungated_reason: >
      Verifying it means knowing the vendor's base URL independently of the pack, which is the pack's
      own claim; there is no second source in the tree to check it against. The bounded protection
      that does exist is structural: only a leading occurrence of one declared prefix is absorbed,
      pinned by a must-not-inflate test that keeps `/admin/users/{id}` from matching `/users/{id}`.
    fix_queued_to: >
      Not queued. The realistic mitigation is review: the declaration sits in `pack.yaml` beside its
      reason, and a prefix that is not a base URL is visible to a human reading the pack, which is
      where every other anchoring claim in this project is also checked.

  # ---------------------------------------------------------------------- ADR-0020 ---

  - id: the-contract-offers-a-version-spelling-the-scorer-refused
    adr: adr-0020-service-qualified-version.md
    hazard: >
      The prompt contract advertises `<service>/v1` as a legal `api_version` answer, and
      `normalize_version` compared it as a plain string, so it never equalled a ground truth written
      `v1`. On an API documented as versioned per service, a model that had read the documentation
      answered the contract's own second form on 55 of 55 endpoints and the dimension reported 1%.
      The published gap would have said that vendor's documentation makes the model WORSE overall,
      on the strength of a dimension measuring this project's own string comparison. `normalize_path`
      had handled the identical case on the path side for cycles, in a comment sitting directly above
      the version code and naming this dimension as where the difference is captured.
    status: gated
    gated_by:
      - core/tests/test_scorer_service_version.py::test_a_service_qualified_version_collapses_to_the_version
      - core/tests/test_scorer_service_version.py::test_a_bare_version_is_untouched
      - core/tests/test_scorer_service_version.py::test_the_collapse_is_symmetric
      - core/tests/test_scorer_service_version.py::test_a_genuinely_different_version_still_scores_zero
      - core/tests/test_scorer_service_version.py::test_the_wrong_service_is_caught_by_the_endpoint_dimension_not_this_one

  - id: normalizing-an-exhibit-erases-the-evidence-that-finds-defects
    adr: adr-0020-service-qualified-version.md
    hazard: >
      `endpoint_matches[].answer_api_version` is an EXHIBIT, not a comparison input, and the first
      attempt at ADR-0020 wrote the normalized form into it. No score moved — the ten affected
      archived answers were wrong before and after — but ten committed `search/v1` strings silently
      became `v1`, destroying the record of what the model actually said. That record is the only
      thing that distinguishes a wrong version from a differently-spelled right one, and reading it
      is how this defect was found at all. The general hazard: any normalization applied to a
      recorded field rather than to a comparison quietly removes the evidence a later cycle needs.
    status: gated
    gated_by:
      - core/tests/test_scorer_service_version.py::test_the_exhibit_records_what_the_model_wrote_not_the_normalized_form
      - packs/sailpoint/tests/test_regression_gate.py::test_per_run_scores_are_byte_identical

  - id: the-prompt-contract-still-advertises-two-spellings-for-one-version
    adr: adr-0020-service-qualified-version.md
    hazard: >
      The scorer now accepts both spellings, which makes the measurement correct and leaves the cause
      in place: the contract still tells every model that `v3` and `<service>/v1` are both fine, so
      answers keep arriving in two notations and every future normalization rule has to keep
      absorbing the difference. The clean fix is to name one spelling in the contract.
    status: ungated
    ungated_reason: >
      The prompt is the shared instrument. Changing it makes every previously measured vendor
      incomparable and cannot be re-applied to archives, whereas a scorer-only change re-scores every
      existing transcript offline at zero model spend — which is what happened here.
    fix_queued_to: >
      The next deliberate cohort re-baseline, where it is now the THIRD prompt-contract item queued
      behind the same trigger, after ADR-0008's unversioned-API wording and ADR-0014's flow-sequence
      example. Three deferrals behind one trigger is itself worth reading as a signal about when that
      re-run should be scheduled. Tracked in ai-readiness-eval.

  - id: an-undocumented-short-text-waiver
    adr: adr-0021-extracted-text-floor.md
    hazard: >
      The text floor can be waived per page. A waiver written as a bare `short_text_ok: true`,
      or as an empty string, would keep a page carrying no documentation while leaving nothing
      in the committed record about who decided that or why — turning a documented exception
      into a silent one, which is the decay mode ADR-0015 exists to catch.
    status: gated
    gated_by:
      - core/tests/test_docs_fetch.py::test_an_override_with_no_argument_behind_it_is_rejected
      - core/tests/test_docs_fetch.py::test_a_declared_reason_keeps_a_short_page_and_records_why

  - id: the-text-floor-is-a-calibrated-number-not-a-measurement
    adr: adr-0021-extracted-text-floor.md
    hazard: >
      200 bytes is a judgement about what a reference page must be able to say, not a value
      derived from any corpus. A vendor whose real documentation pages sit just under it would
      be reclassified as unfetchable, and that reads as a finding about the vendor.
    status: ungated
    ungated_reason: >
      The same class as ADR-0009's retry floor, which is also calibrated against what was in
      front of it. Deriving the number needs a corpus of pages known-good independently of this
      instrument, which is the thing the instrument is for. What bounds the damage is that the
      misclassification cannot be silent: the page is recorded as a fetch error with its real
      byte count in the message, and a pack that disagrees says so in the manifest.
    fix_queued_to: >
      Not queued as a derivation. The boundary is pinned in both directions by
      test_the_floor_is_a_floor_and_not_a_haircut, so the number cannot drift without a
      deliberate edit, and any pack that meets it argues its own case in `short_text_ok`.

  - id: a-declared-short-text-reason-is-never-rechecked
    adr: adr-0021-extracted-text-floor.md
    hazard: >
      Nothing verifies that a page declaring `short_text_ok` still needs to. If a vendor ships
      server-rendered documentation, the waiver goes stale and the pack keeps asserting a
      condition that stopped being true — the same shape as the stale cohort table that produced
      three false superlatives before anything checked it.
    status: ungated
    ungated_reason: >
      Core cannot see it. The check compares a declared reason against a fetched byte_size in a
      committed manifest, and the manifests live in the packs repo, not here. A gate in this
      repo would have nothing to run against.
    fix_queued_to: >
      Gated pack-side, where the manifests are: a test asserting every anchored page either
      clears the floor or declares a reason, AND that no page declares a reason it no longer
      needs. Built with the pack that forced this ADR.

  - id: a-repair-trigger-that-enumerates-notations
    adr: adr-0022-repair-trigger-asks-the-parser.md
    hazard: >
      ADR-0014's repair decided which line to rewrite by scanning for a square bracket, the
      notation it happened to have seen. A brace placeholder — `[scp.pc.{role}]` — is equally
      invalid YAML, carries no square bracket, and was classified as "already valid", so the one
      broken line in the block was skipped and the whole answer discarded. Any trigger that lists
      the shapes it knows about fails silently on the first shape nobody listed.
    status: gated
    gated_by:
      - core/tests/test_answer_block.py::test_repairs_a_brace_placeholder_in_a_scope_list
      - core/tests/test_answer_block.py::test_the_trigger_asks_the_parser_rather_than_scanning_for_characters
      - core/tests/test_answer_block.py::test_a_valid_flow_sequence_is_still_never_rewritten

  - id: a-rescued-run-silently-changes-a-denominator
    adr: adr-0022-repair-trigger-asks-the-parser.md
    hazard: >
      A format failure is excluded from every dimension's denominator, not scored zero. So any change
      to the parser that rescues a run alters what a published percentage is an average *of*, and can
      move it in either direction — this one moved a cell down. Nothing on a card distinguishes "the
      model got worse" from "the instrument started counting a run it used to drop", and nothing warns
      that a re-score changed a denominator rather than a score. ADR-0022 was drafted asserting the
      opposite scoring behaviour from memory; the arithmetic contradicted it.
    status: ungated
    ungated_reason: >
      Not a property of the code but of how a number is read. `rebuild-report` already records a
      disclosure note in metadata and summary, and both re-scores this cycle carry one; whether a card
      then explains the movement is an authoring act, not an assertion a test can make.
    fix_queued_to: >
      Not queued as a gate. The candidate is a scored-run count printed beside every dimension so a
      denominator change is visible on the card itself, rather than recoverable only by diffing two
      scores.json. Worth doing when the next parser change touches an already-published pack, which
      this one did not.

  - id: the-item-guard-is-the-only-thing-bounding-a-widened-trigger
    adr: adr-0022-repair-trigger-asks-the-parser.md
    hazard: >
      With the trigger no longer restricted to a punctuation shape, `_REPAIR_ITEM_RE` is the sole
      remaining barrier between the repair and a manufactured containment score. Removing or
      loosening it would not fail any trigger test — the two guards are independent — so its
      importance is not visible from the code that now depends on it.
    status: gated
    gated_by:
      - core/tests/test_answer_block.py::test_a_comma_inside_a_quoted_item_is_never_split
      - core/tests/test_answer_block.py::test_a_quoted_scope_sentence_is_never_split
      - core/tests/test_answer_block.py::test_prose_items_are_not_repaired
      - core/tests/test_answer_block.py::test_an_unterminated_quote_abandons_the_repair

  # ------------------------------------------------------------------------ ADR-0023 -----

  - id: a-marker-for-one-style-lives-inside-another-styles-prose
    adr: adr-0023-either-of-auth-styles.md
    hazard: >
      `api-key`'s marker appears verbatim inside HMAC request-signing prose, because the key is
      what gets signed. Ground truth describing request signing therefore canonicalized to
      `api-key` — not to `unknown` — so ADR-0011's blocking guard never fired, and the dimension
      ran BACKWARDS: the answer correctly naming the signature scored 0 and "just send your API
      key" scored 1. The same shape shipped on a published card, where ground truth naming both a
      key header and a session credited only the session.
    status: gated
    gated_by:
      - core/tests/test_scorer.py::test_request_signing_outranks_the_key_it_signs_with
      - core/tests/test_scorer.py::test_bare_signed_is_not_an_hmac_marker
      - core/tests/test_scorer.py::test_access_token_ranks_last_so_it_cannot_recanonicalize_oauth_prose

  - id: an-acceptable-style-set-can-make-any-answer-right
    adr: adr-0023-either-of-auth-styles.md
    hazard: >
      Once ground truth may accept more than one login style, the cheapest way to raise any auth
      number is to declare another alternate. Nothing about a wider set fails loudly — the
      dimension stays applicable and every answer starts passing — so the widening has to be
      bounded where it is authored rather than noticed where it is published.
    status: gated
    gated_by:
      - core/tests/test_scorer.py::test_an_unknown_style_blocks_rather_than_widening_nothing
      - core/tests/test_scorer.py::test_declaring_the_style_the_prose_already_requires_blocks
      - core/tests/test_scorer.py::test_an_alternate_on_a_rehosting_host_blocks
      - core/tests/test_scorer.py::test_an_alternate_the_prose_never_names_blocks
      - core/tests/test_scorer.py::test_accepting_every_style_blocks
      - core/tests/test_roundtrip.py::test_a_bad_alternate_blocks_the_pack_before_any_grid

  - id: an-alternate-is-only-as-true-as-its-evidence-link
    adr: adr-0023-either-of-auth-styles.md
    hazard: >
      The rules check that an alternate names a real style, cites a first-party host, and is named
      in the prose. None of them checks the thing that actually matters: that the vendor documents
      the two styles as interchangeable FOR THAT OPERATION. A first-party URL to a page about a
      different endpoint satisfies every rule on disk.
    status: ungated
    ungated_reason: >
      Deciding whether a page supports a claim about a specific operation means reading it, which
      is a different class of instrument than a deterministic scorer. The rules deliberately bound
      what can be declared and make it legible; they do not adjudicate it.
    fix_queued_to: >
      Not queued as a gate. The honest mitigation is review: an alternate is a reviewable line in
      a PR carrying its own link, which is why `evidence` and `note` are required rather than
      optional. Revisit if a second pack ever declares one.

  - id: a-hazard-found-after-its-adr-has-no-route-into-this-registry
    adr: adr-0023-either-of-auth-styles.md
    hazard: >
      This registry is built from ADRs — every ADR must appear in an entry or be declared
      hazard-free — so a hazard discovered LATER, and filed as a GitHub issue, never enters it. The
      one-style limitation was filed as issue #20 in cycle 15 and sat outside all 68 entries for
      four cycles while a card carrying its distortion was queued for outreach. The registry
      reported full ADR coverage the entire time, which was true and beside the point.
    status: ungated
    ungated_reason: >
      A test can check that every ADR is accounted for because ADRs live in this repo on disk. It
      cannot enumerate the open issue tracker, and a gate that required every open issue to have a
      registry entry would either be unenforceable offline or would convert the tracker into a
      second registry with no owner.
    fix_queued_to: >
      Not queued. The candidate is a convention rather than a gate — an issue that describes an
      instrument hazard gets a registry entry when it is filed, not when it is fixed — and it is
      recorded here so the next cycle that files one can adopt it deliberately.

  - id: a-new-file-is-unguarded-until-it-is-staged
    adr: adr-0023-either-of-auth-styles.md
    hazard: >
      The leak guard scans `git ls-files`, so a file that has been written but not yet `git add`ed
      is invisible to it. A green suite therefore proves nothing about the ADR the cycle just
      wrote — which is precisely the file where a cycle narrates what it measured, and so the
      likeliest place for a prospect name to appear. Hit live in this cycle: the draft of ADR-0023
      named a measured prospect three times and the full suite passed 662 tests over it.
    status: ungated
    ungated_reason: >
      Scanning the working tree instead of the index would flag scratch files, editor backups and
      anything a reviewer is midway through, so the guard would cry wolf and be ignored. The index
      is the right scope; the gap is one of timing, not of scope.
    fix_queued_to: >
      Not queued as a code change. The mitigation is procedural and belongs to the cycle: stage
      first, then run the suite, and never read a pre-staging green as evidence about new files.
      A pre-commit hook is the obvious candidate if this recurs.

  # ------------------------------------------------------------------------ ADR-0024 -----

  - id: exact-name-matching-punishes-a-more-precise-answer
    adr: adr-0024-parameter-ancestors.md
    hazard: >
      `key_parameters` compared names by exact string match, so ground truth naming a request-body
      container (`amount`) scored 0 against an answer naming the field inside it
      (`amount.total`) — an answer that is strictly more useful to a developer. One pack's
      dimension read 7.3% while the model had named every required container on four runs of five.
      Two already-published cards call required parameters their weakest dimension, and part of
      that weakness was the instrument.
    status: gated
    gated_by:
      - core/tests/test_scorer.py::test_naming_a_sub_field_names_its_parent
      - core/tests/test_scorer.py::test_the_separator_must_be_a_real_dotted_path
      - core/tests/test_scorer.py::test_a_sibling_field_does_not_satisfy_a_specific_requirement
      - core/tests/test_scorer.py::test_flat_parameter_answers_are_unaffected

  - id: parameter-ancestry-can-only-move-a-score-upward
    adr: adr-0024-parameter-ancestors.md
    hazard: >
      Ancestry widens what counts as naming a parameter, so every score it can move, it moves UP.
      Reversing the direction — crediting a container for a requirement on a field inside it —
      would let a vague answer pass a specific requirement, and nothing about the resulting number
      would look wrong. The asymmetry is the only thing preventing it and is invisible from the
      call site.
    status: gated
    gated_by:
      - core/tests/test_scorer.py::test_a_container_does_not_satisfy_a_requirement_for_a_field_inside_it

  - id: key-parameters-measures-naming-not-understanding
    adr: adr-0024-parameter-ancestors.md
    hazard: >
      The dimension compares parameter names. An answer naming `amount.total` scores identically
      whether or not it knows `total` is a decimal in major units, and an answer may name every
      required container while omitting a different required field entirely, since the dimension is
      all-or-nothing per task.
    status: ungated
    ungated_reason: >
      Inherent to deterministic scoring, which is the property that makes this method reproducible.
      Judging whether an answer understands a parameter would require a model in the scoring loop —
      the same limit already recorded for auth_flow.
    fix_queued_to: >
      Not queued, and not intended to be. Recorded so the dimension is not read as more than it is.

  - id: a-scoring-exception-for-one-vendor-makes-its-headline-incomparable
    adr: adr-0027-path-version-parity.md
    hazard: >
      ADR-0025 carved out an exception: dotted numeric versions were folded for the api_version
      dimension but NOT stripped from the path, while `vN` versions were stripped for both. The
      argument for the exception was locally sound and globally wrong — it meant a vendor spelling
      its version `2.1` rather than `v2` paid for ONE mistake in TWO dimensions, and its headline
      was therefore produced by a harsher rule than the ten packs beside it. In a study whose entire
      output is the comparison between vendors, a per-vendor scoring rule is the failure that
      invalidates the product rather than one number. It was invisible for exactly one cycle,
      because no measured vendor had used that notation before.
    status: gated
    gated_by:
      - core/tests/test_scorer.py::test_a_dotted_version_segment_is_stripped_from_a_path_like_any_other
      - core/tests/test_scorer.py::test_the_version_dimension_still_has_teeth_after_the_path_stops_carrying_it

  - id: stripping-a-version-segment-must-never-reach-an-identifier
    adr: adr-0027-path-version-parity.md
    hazard: >
      `normalize_path` now deletes a dotted numeric segment. The dot is the only thing separating a
      version from an identifier: if a bare integer were ever stripped, `/jobs/123/reset` and
      `/jobs/456/reset` would compare equal, and an endpoint score would be manufactured out of an
      id. That is the one direction this rule can inflate a result, and the guard is a regex detail
      invisible from either call site.
    status: gated
    gated_by:
      - core/tests/test_scorer.py::test_stripping_a_version_segment_never_reaches_an_identifier

  - id: the-fix-moved-a-headline-toward-the-hypothesis-under-test
    adr: adr-0027-path-version-parity.md
    hazard: >
      ADR-0027 was written in the cycle whose grid it re-scores, by the same author, and it moves
      that pack's numbers in the direction of the hypothesis the cycle set out to test. Nothing
      about the resulting table looks wrong, which is precisely the problem: a scoring change made
      after seeing a result is the hardest kind of bias to detect from the artifact.
    status: ungated
    ungated_reason: >
      Not checkable by a test — it is a claim about why a change was made, not about what it does.
      The mitigations are on the record instead: the rule is vendor-agnostic and restores parity
      with ten existing packs rather than being fitted to one; it is argued from the scorer's own
      pre-existing design comment, written many cycles earlier; it is provably inert on every
      archived pack (666 pairs, 0 flips); the affected dimension still scores 0 on the same tasks,
      so the finding it was accused of rescuing does not actually change sign; and the card
      publishes BOTH the corrected split and the split under the superseded rule.
    fix_queued_to: >
      Not queued as a check. The durable fix is procedural and already the standing rule — decide a
      scoring question BEFORE the grid, which is what ADR-0025 did and what let this one be caught
      as an instrument suspect rather than published as a finding.

  - id: api-version-still-requires-exactly-one-spelling
    adr: adr-0025-dotted-numeric-version.md
    hazard: >
      ADR-0025 collapses a notation difference; it does not let ground truth accept two DIFFERENT
      versions. Where a vendor's own current documentation publishes two versions for one operation
      — the next measured target shows `/api/2.1/jobs/create` on one live page and `/api/2.2/jobs/get`
      on another — the answer key must pick one, and a model naming the other scores 0 on a dimension
      where it is quoting the vendor verbatim. This is exactly the hazard ADR-0023 fixed for
      `auth_flow`, in a different dimension, and it is not fixed here.
    status: ungated
    ungated_reason: >
      The fix is an `api_version_alternates` block mirroring ADR-0023 — authored, evidenced against a
      first-party page, and blocked at the roundtrip gate — not a scorer widening. Building it inside
      a vendor cycle would mean designing a scoring mechanism and the pack that motivates it in the
      same change, which is how a mechanism ends up shaped to flatter one result.
    fix_queued_to: >
      Filed as a core issue this cycle. The pack that forced it discloses the disagreement in
      `specs.yaml` and counts, on its card, how many runs answered the version the vendor also
      publishes — so the size of the residue is measured rather than argued.

  - id: the-dotted-fold-stops-at-the-dot
    adr: adr-0025-dotted-numeric-version.md
    hazard: >
      `v1` and `1` remain different strings. A vendor numbering its paths `/api/1/...` with no `v`
      would hit the identical fault ADR-0025 exists to fix, and would not be caught by it.
    status: ungated
    ungated_reason: >
      Deliberate and load-bearing. `v1` occurs 694 times across the archived cohort, so folding it
      could move published numbers; requiring the dot is precisely what makes ADR-0025 provably inert
      on every archive (0 of 666 pairs flip). Widening it is a decision that should be forced by a
      real vendor and paid for with a re-score, not taken speculatively.
    fix_queued_to: >
      Not queued. No measured or queued vendor uses that notation. Recorded so that the next one is
      recognised as this hazard rather than rediscovered as a surprise.

  - id: a-task-group-is-authored-not-derived
    adr: adr-0026-pack-task-groups.md
    hazard: >
      Nothing in this repo can check that a declared group is TRUE of the world — that "long-stable"
      describes the Jobs API, or that a surface shipped when the card says it did. The validator
      proves only that the grouping partitions the pack. A pack could therefore assemble two groups
      that make its headline read as a finding, and every gate would pass.
    status: ungated
    ungated_reason: >
      Not checkable from inside the repo: the claim is about the world, not about the files. The
      required `rationale` field is the mitigation — it blocks rather than warns, so the argument a
      reviewer must disagree with is always present — together with the grouping being committed
      before the grid runs and the per-task table being published beside the group table.
    fix_queued_to: >
      Not queued. The reviewable-argument requirement is the intended end state; a stronger check
      would have to encode vendor release history, which this project has no first-party source for.

  - id: two-groups-can-differ-in-task-mix-rather-than-in-the-property-tested
    adr: adr-0026-pack-task-groups.md
    hazard: >
      A group split reports a difference between two sets of tasks; it does not establish WHAT
      differs. If one group happens to hold the harder tasks, the table measures difficulty and the
      card reports it as the declared property. The validator cannot see this: both groupings
      partition the pack identically.
    status: ungated
    ungated_reason: >
      The mitigation belongs to the pack, not to core — groups must be matched on task `category`
      and as far as possible on `job_category`, and the card must state the matching. Core cannot
      enforce a balance rule without deciding for every future pack what "balanced" means on an axis
      it has never seen.
    fix_queued_to: >
      Not queued as a core check. The first pack to use groups matches its two groups on difficulty
      tier and job category and says so on the card; if a later pack cannot match, that is a reason
      for it to decline the split rather than for core to grow a rule.

  - id: the-guard-matched-what-a-vendor-is-called-not-what-it-sells
    adr: adr-0028-product-name-guard.md
    hazard: >
      Every field the leak guard derived its tokens from — id, display_name, guard_tokens,
      guard_tokens_cased — answers one question: what is this vendor CALLED. A public file naming
      four of a target's distinctive product names identifies it exactly as surely, and no token
      derived from an id can ever match one, so the guard stayed green over it. Found by a human
      reading the file, which is not a control that scales. Products are now declared explicitly and
      scanned alongside the name.
    status: gated
    gated_by:
      - core/tests/test_factory.py::test_product_tokens_are_returned_apart_from_the_name_tokens
      - core/tests/test_factory.py::test_narrowing_the_name_does_not_disarm_the_products
      - core/tests/test_core_no_vendor.py::test_the_product_token_list_is_not_empty

  - id: an-unbounded-product-token-makes-the-guard-unusable-rather-than-noisy
    adr: adr-0028-product-name-guard.md
    hazard: >
      Vendor tokens are matched as substrings, which is free for a distinctive company name. A
      product name is frequently ordinary technical English, and matched the same way it fires on
      every longer word containing it: the first run of the widened guard reported EIGHT false
      positives against one true one. The hazard is not the noise, it is what noise does to a guard
      — an instrument that cries wolf at that ratio is one somebody switches off or routes around,
      which is a worse state than the gap it was built to close. Product tokens are `\b`-bounded,
      and a name made of ordinary English must be declared cased so the lowercase words stay silent.
    status: gated
    gated_by:
      - core/tests/test_core_no_vendor.py::test_a_product_token_does_not_fire_inside_a_longer_word
      - core/tests/test_core_no_vendor.py::test_cased_product_regex_fires_on_the_proper_noun_only
      - core/tests/test_core_no_vendor.py::test_product_regex_fires_on_the_product_name

  - id: prose-about-the-guard-is-where-the-leak-wants-to-live
    adr: adr-0028-product-name-guard.md
    hazard: >
      Building this guard produced TWO fresh leaks in one cycle, neither noticed while writing: the
      code comment explaining the boundary rule quoted the two offending product tokens and named a
      real vendor, and the first draft of ADR-0028 illustrated the new YAML field with a real
      target's actual products. The natural way to document a token list is to show real tokens, so
      this is the DEFAULT behaviour when explaining the rule rather than one author's slip. Both
      were caught only because the scan exempts nothing, including the files that discuss it —
      the ADR-0018 no-exemption property, now load-bearing for a second reason.
    status: gated
    gated_by:
      - core/tests/test_core_no_vendor.py::test_the_guard_does_not_exempt_its_own_file
      - core/tests/test_core_no_vendor.py::test_public_repo_names_no_prospect

  - id: the-product-token-list-is-an-authors-judgement-and-cannot-be-complete
    adr: adr-0028-product-name-guard.md
    hazard: >
      A product the queue does not name is a product the guard does not know. 143 tokens across 19
      targets were written by hand from recon, and nothing checks that a target's list covers its
      catalogue — a vendor that renames a product, or ships a new one, silently loses that token.
      The non-vacuity gate proves the list is non-EMPTY; nothing can prove it is COMPLETE.
    status: ungated
    ungated_reason: >
      Completeness is not checkable without an oracle for what a vendor sells, which is the same
      class of problem as the recon it would be checking. A stale or partial list still guards more
      than the zero product tokens that existed before it.
    fix_queued_to: >
      Not queued. The procedural cover is that product tokens are written when a target is added to
      the queue, and reviewed in the private repo where naming products is safe.

  - id: an-unqueued-target-contributes-no-tokens-at-all
    adr: adr-0028-product-name-guard.md
    hazard: >
      The guard matches a list, so it can only match a name it has been told. A target with no queue
      entry yet contributes ZERO tokens — the guard is not weak about it, it is silent — and cycles
      naturally draft an ADR or a plan before the entry exists. That is precisely how the near-miss
      behind issue #40 happened: the prose came first, and there was nothing to match it against.
      No list-based guard can close this.
    status: ungated
    ungated_reason: >
      Structural. Only ordering closes it: add the queue entry, with its name and product tokens,
      BEFORE writing any public prose about a target. A test cannot enforce an ordering between an
      edit in this repository and an edit in a private one.
    fix_queued_to: >
      Not queued as a test. The rule is now written in the guard's module docstring and the private
      queue's header — both tracked, both visible in a PR diff — because it previously lived only in
      a gitignored handoff note, invisible to the review that is the actual control.

  # ------------------------------------------------------------------ ADR-0029 -----
  - id: an-unvendorable-spec-had-no-honest-encoding
    adr: adr-0029-availability-and-vendorability-are-two-findings.md
    hazard: >
      The recon gate read spec AVAILABILITY and never read `permits_vendoring`, a field every pack
      in the cohort records. A vendor publishing a real first-party machine-readable spec under an
      all-rights-reserved licence therefore had exactly two passable encodings and both were wrong:
      write `machine_readable_spec_available: no`, putting a false claim on a published card and
      destroying the finding the card exists to report, or commit a copyrighted document. A gate
      that forces its own input to be false is measuring itself.
    status: gated
    gated_by:
      - core/tests/test_factory.py::test_recon_passes_a_spec_that_exists_but_may_not_be_vendored
      - core/tests/test_factory.py::test_recon_blocks_an_unvendorable_pack_that_vendored_the_spec_anyway
      - core/tests/test_factory.py::test_permits_vendoring_no_is_not_a_shortcut_past_the_vendoring_requirement

  - id: an-unreadable-availability-value-passed-as-doc-anchored
    adr: adr-0029-availability-and-vendorability-are-two-findings.md
    hazard: >
      `machine_readable_spec_available` was compared literally after `.lower()`, so every value
      outside yes/partial — a typo, a trailing space, a hedge such as `unknown` — fell through to
      the doc-anchored PASS. The one value that most needed to block, an availability the gate
      cannot read, was the only one that passed silently, and the pack then ran a full grid in a
      mode nobody had chosen for it.
    status: gated
    gated_by:
      - core/tests/test_factory.py::test_recon_blocks_an_unreadable_availability
      - core/tests/test_factory.py::test_recon_blocks_an_unreadable_permits_vendoring
      - core/tests/test_factory.py::test_recon_blocks_a_pack_that_never_states_whether_vendoring_is_permitted

  - id: the-context-budget-can-delete-the-answer-and-look-like-a-docs-gap
    adr: adr-0029-availability-and-vendorability-are-two-findings.md
    hazard: >
      public-docs enforces its token budget by cropping the tail of the last page it keeps. When the
      cropped page carries the operation a task asks about, the score measures OUR budget rather than
      the vendor's documentation — and nothing downstream can tell them apart, because a
      truncated-away endpoint and an undocumented endpoint produce an identical transcript. This is
      the ADR-0013 fault class, which once reported a dimension at 13.7% while the model was right in
      98% of runs.
    status: gated
    gated_by:
      - core/tests/test_docs_truncation.py::test_the_budget_never_deletes_a_documented_ground_truth_path
      - core/tests/test_docs_truncation.py::test_the_matcher_finds_paths_that_are_really_there
      - core/tests/test_docs_truncation.py::test_the_sweep_enumerates_packs

  - id: a-licence-claim-is-unfalsifiable-by-this-harness
    adr: adr-0029-availability-and-vendorability-are-two-findings.md
    hazard: >
      `permits_vendoring: no` opens the branch that excuses a pack from vendoring, and nothing in
      this repository can check whether it is true. The gate can prove the pack did not redistribute
      the document and did record where it is; it cannot read a vendor's terms of use. A pack that
      would rather write one line than vendor a file can say `no` and be believed.
    status: ungated
    ungated_reason: >
      Verifying a licence means reading a vendor's terms and forming a legal judgement, which no
      test can do and no fetch can settle. The mitigation is structural rather than detective: the
      branch is deliberately the MORE laborious one — it forbids the spec file outright, so every
      endpoint must be hand-anchored to its own docs-manifest page instead of resolving by
      operationId — so a false claim buys work rather than saving it.
    fix_queued_to: >
      Not queued, and not closable by a test. `license` and `where`/`where_now` are required
      precisely so a human reviewer can check the claim in the one place it can be checked, which
      is the vendor's own site.

  - id: the-vendorability-ruling-is-read-from-the-first-word-of-prose
    adr: adr-0029-availability-and-vendorability-are-two-findings.md
    hazard: >
      Some packs write `permits_vendoring` as a paragraph rather than a flag, and one rules BOTH
      WAYS in a single field — yes for the copy it vendors, no for a second published copy that
      carries no licence file. `_ruling` reads the leading token and ignores the argument after it,
      so a pack whose prose opens with the wrong ruling is read backwards, and one that opens with a
      hedge is blocked for a reason that reads like a typo.
    status: ungated
    ungated_reason: >
      The alternative is to forbid prose and demand a bare flag, which would discard the argument
      that makes the finding worth reading and would move packs that are already published. Reading
      the leading word is the convention those packs were written in, not a new one imposed on them.
    fix_queued_to: >
      Not queued as a parser change. The field's contract — lead with the ruling, then argue it — is
      stated in ADR-0029 and repeated in the gate's own error text, which is where an author who
      gets it wrong will read it.
    drift_pin:
      - core/tests/test_factory.py::test_a_prose_permits_vendoring_is_read_from_its_leading_ruling

  - id: packs-published-under-the-overloaded-availability-flag
    adr: adr-0029-availability-and-vendorability-are-two-findings.md
    hazard: >
      Because the gate had no passable encoding for "a real machine-readable spec exists and its
      licence forbids keeping a copy", packs already in the cohort wrote
      `machine_readable_spec_available: no` with a comment above the flag explaining that it does not
      mean what it says. Those cards are published. Until they are re-encoded, the cohort's
      availability finding is NOT comparable across vendors: one value means "nothing exists" for
      some packs and "something exists that we may not keep" for others, and a cross-vendor reading
      of that dimension silently mixes them.
    status: ungated
    ungated_reason: >
      Re-encoding edits a private pack in a way that changes the LEAD FINDING of an already
      published card, which is a re-review of those cards rather than a core change. Doing it in the
      same change that opens the branch would mean altering published claims inside the review that
      authorized the alteration.
    fix_queued_to: >
      Filed against the private packs repo: re-recon the affected packs under the new vocabulary and
      re-issue their cards. This public gate change is what unblocks it.

  - id: the-reference-pack-does-not-pass-the-recon-gate
    adr: adr-0029-availability-and-vendorability-are-two-findings.md
    hazard: >
      The reference pack declares an available spec under a permissive licence and deliberately
      vendors nothing, because a frozen upstream repository holds the vendored closure. That is a
      THIRD honest combination the gate cannot express, and the gate has blocked this pack since
      ADR-0006 with nobody noticing: recon runs only when the factory dispatches a target, and the
      reference pack is never dispatched. The round-trip control (ADR-0010) sweeps every pack on
      disk for exactly this reason; recon does not, and that asymmetry is what hid it.
    status: ungated
    ungated_reason: >
      A suite-wide recon sweep would have failed on the reference pack the day it was written, so
      the compatibility check added here covers external packs only and says so in its docstring.
      Closing the gap requires deciding what "anchored offline forever" means when the anchor is
      deliberately somewhere else.
    fix_queued_to: >
      Filed. Two candidate resolutions — vendor the closure into the reference pack, or let a pack
      cite an external vendored copy by URL, byte count and hash — and choosing between them is a
      decision, not a bug fix.
    drift_pin:
      - core/tests/test_factory.py::test_the_reference_pack_recon_state_is_pinned

  # ------------------------------------------------------------------ ADR-0030 -----
  - id: a-grant-is-shadowed-by-the-credential-it-produces
    adr: adr-0030-authorization-code-is-a-login-style.md
    hazard: >
      Prose describing an OAuth grant necessarily names the credential the grant produces — an
      authorization-code flow cannot be documented without saying that the result is sent as
      `Authorization: Bearer`. With `bearer-token` ranked above the grant, such a ground truth
      canonicalized to bearer-token while a model answering the precise "OAuth2 authorization code
      with PKCE" canonicalized to `unknown`, so the dimension INVERTED: the exact answer scored 0 and
      a vaguer one scored 1. Two packs read 0.0 on both conditions, one of them already published.
    status: gated
    gated_by:
      - core/tests/test_scorer.py::test_the_authorization_code_grant_outranks_bearer_or_the_dimension_inverts
      - core/tests/test_scorer.py::test_the_authorization_code_grant_is_a_style_of_its_own
      - core/tests/test_scorer.py::test_the_authorization_code_grant_does_not_outrank_an_explicit_client_credentials_grant

  - id: widening-the-grant-markers-would-fire-on-ordinary-code-prose
    adr: adr-0030-authorization-code-is-a-login-style.md
    hazard: >
      The markers for the authorization-code style are phrases (`authorization code`, `auth code`,
      `pkce`). The obvious next edit is to add the bare word `code`, which would fire on every
      `code_verifier`, `status code` and HTTP-code mention in the cohort and silently reclassify
      unrelated ground truth.
    status: gated
    gated_by:
      - core/tests/test_scorer.py::test_the_authorization_code_markers_do_not_fire_on_ordinary_code_prose

  - id: the-round-trip-control-cannot-see-a-wrong-but-listed-style
    adr: adr-0030-authorization-code-is-a-login-style.md
    hazard: >
      ADR-0011 blocks a pack whose ground-truth auth style canonicalizes to `unknown`, and ADR-0010's
      control scores each key against itself. Neither can see a key that canonicalizes to the WRONG
      listed style: the guard fires on silence, not on being wrong, and an answer key always matches
      itself. This is the fourth recorded instance of that limit being the reason a defect survived
      (after ADR-0013, ADR-0017 and ADR-0020).
    status: ungated
    ungated_reason: >
      Structurally unclosable by the control itself. Detecting a wrong-but-listed style needs an
      oracle for what the vendor's documentation actually says, which is the recon judgement the key
      encodes in the first place. What caught it was the standing suspect-instrument rule plus
      reading transcripts, and that is a practice rather than a test.
    fix_queued_to: >
      Not queued as a test, and recorded as not closable. The practice it depends on — a dimension
      reading uniformly zero is a suspect before it is a finding — is now stated in four ADRs and is
      the actual control.

  - id: auth-flow-still-forces-one-style-on-a-multi-credential-api
    adr: adr-0030-authorization-code-is-a-login-style.md
    hazard: >
      `auth_flow` picks exactly one style. A real API often accepts several credentials for the same
      call, and adding an eighth style widens the vocabulary without changing that. A vendor
      documenting two equally valid flows still has one of them scored 0 unless the pack declares an
      alternate.
    status: ungated
    ungated_reason: >
      Making the dimension multi-label changes what every published number means and would make the
      cohort incomparable across the change. `auth_flow_alternates` (ADR-0023) is the deliberate
      narrow mitigation.
    fix_queued_to: >
      Filed as core issue #20, which predates this ADR and is the standing home for the limitation.

  # ------------------------------------------------------------------------ ADR-0031 ---

  - id: every-gate-read-the-answer-key-and-none-read-the-question
    adr: adr-0031-a-prompt-must-name-its-target.md
    hazard: >
      Until this ADR, `recon`, `validate`, `roundtrip`, `anchoring` and the truncation audit all
      read the ANSWER KEY. Nothing read the question. A prompt that was answerable but
      under-specified — naming no vendor and no product — passed every gate, and a whole grid was
      run, read and discarded at a cost of $9.16 before a human reading one transcript found it.
      45 of 60 cold runs were the measured model correctly refusing to guess.
    status: gated
    gated_by:
      - core/tests/test_prompt_gate.py::test_the_prompt_that_started_this_fails_on_both_counts
      - core/tests/test_run_guard.py::test_a_grid_whose_prompts_name_nobody_is_blocked
      - core/tests/test_factory.py::test_prompts_gate_blocks_a_pack_whose_prompt_names_nobody
      - core/tests/test_factory.py::test_the_prompt_gate_runs_before_the_answer_key_gates

  - id: a-pack-that-declares-no-naming-rule-would-be-unmeasurable-silently
    adr: adr-0031-a-prompt-must-name-its-target.md
    hazard: >
      The gate can only match names a pack declares. A pack that declared neither list would have
      nothing to check against, and any default — deriving tokens from `display_name`, or skipping
      the gate — would report a pass on a pack the gate never actually read.
    status: gated
    gated_by:
      - core/tests/test_prompt_gate.py::test_a_pack_declaring_neither_list_fails_closed
      - core/tests/test_prompt_gate.py::test_a_blank_name_is_refused_because_it_would_match_every_prompt
      - core/tests/test_prompt_gate.py::test_every_pack_on_disk_declares_what_naming_it_means
      - core/tests/test_factory.py::test_prompts_gate_blocks_a_pack_that_declares_nothing

  - id: a-substring-matcher-would-find-a-short-product-mark-inside-an-ordinary-word
    adr: adr-0031-a-prompt-must-name-its-target.md
    hazard: >
      Several real product marks are three-letter abbreviations. Matched as plain substrings they
      occur inside ordinary English words, so a pack whose prompts never name the target would be
      reported as fully compliant — a green check on a false claim, which is worse than no gate.
    status: gated
    gated_by:
      - core/tests/test_prompt_gate.py::test_a_name_buried_inside_a_longer_word_does_NOT_match
      - core/tests/test_prompt_gate.py::test_the_matcher_still_finds_a_name_that_is_really_there

  - id: core-cannot-tell-a-product-mark-from-a-bare-corporate-parent
    adr: adr-0031-a-prompt-must-name-its-target.md
    hazard: >
      A name may be declared as both a vendor name and a product name, which ADR-0031 permits for a
      product mark distinctive enough to identify its vendor and forbids for a bare corporate
      parent. Both are strings. Listing a parent as its own product name would turn every
      under-specified prompt green while changing nothing true about it, and core cannot see the
      difference.
    status: ungated
    ungated_reason: >
      Deciding whether a name identifies one vendor requires knowing the world, not the repository.
      Core reports every dual-listing by name in `validate`, in `prompts` and in the factory's gate
      detail, so the claim is visible in ordinary output; the judgement is a review item. A check
      that guessed would either block a legitimate product mark or wave through a parent, and both
      would read as coverage this has not got.
    fix_queued_to: >
      Not queued in core, and recorded as not closable there. The reviewed list of permitted
      dual-listings is asserted pack-side in the packs repo's own suite, so adding one is a visible
      act rather than a config edit nobody reads.

  - id: reference-pack-prompts-name-an-ambiguous-abbreviation
    adr: adr-0031-a-prompt-must-name-its-target.md
    hazard: >
      10 of the 11 prompts in the in-repo reference pack identify their target only by a
      three-letter abbreviation that belongs to several unrelated real organizations. The pack
      therefore FAILS its own prompt gate. Its absolute numbers are bounded by that ambiguity —
      but its FINDING is not: every condition was run with identical prompts, so the gap between
      conditions, which is what this method measures, is unaffected.
    status: ungated
    ungated_reason: >
      Not fixable without rewriting the questions that produced the frozen 73/68/93 regression
      anchor, which would silently re-baseline the one table this repo checks itself against. The
      gate is not weakened to accommodate it and no exemption mechanism exists: the pack simply
      fails, and the failure is pinned by exact task id.
    drift_pin:
      - core/tests/test_prompt_gate.py::test_the_reference_pack_prompt_state_is_pinned
      - core/tests/test_prompt_gate.py::test_the_one_reference_prompt_that_names_the_vendor_still_does
      - core/tests/test_prompt_gate.py::test_the_ambiguous_abbreviation_is_not_declared_as_a_vendor_name
    fix_queued_to: >
      Filed as issue #51. Deliberately NOT taken: a re-baseline of the frozen anchor is not a change
      a cycle makes inside the review that would authorize it.

  - id: naming-a-target-does-not-make-a-question-good
    adr: adr-0031-a-prompt-must-name-its-target.md
    hazard: >
      The gate closes exactly one failure mode. A prompt can name its vendor and its product and
      still be leading, ambiguous, or asking for something the vendor does not have — and it passes.
      It also cannot judge a declared name: a pack that declares a misleading one gets a green check
      on a false claim.
    status: ungated
    ungated_reason: >
      Judging whether a question is well posed is the authoring judgement the whole method rests on.
      No mechanical check substitutes for it, and one that pretended to would be worse than the
      honest absence.
    fix_queued_to: >
      Not queued, and recorded as not closable mechanically. ADR-0032's circuit breaker is the
      partial empirical cover: it catches an unanswerable question after 20 runs, at real cost.

  # ------------------------------------------------------------------------ ADR-0032 ---

  - id: a-grid-whose-question-is-broken-used-to-run-to-completion-and-publish
    adr: adr-0032-format-failure-circuit-breaker.md
    hazard: >
      A condition with a 75% format-failure rate against a 0% sibling ran to completion, wrote its
      reports and printed a headline better than the truth. The signal was in the run's own output
      and nothing acted on it.
    status: gated
    gated_by:
      - core/tests/test_run_guard.py::test_the_breaker_fires_at_the_floor_on_a_broken_question
      - core/tests/test_run_guard.py::test_a_synthetic_broken_grid_would_have_been_caught
      - core/tests/test_run_guard.py::test_the_threshold_in_force_is_recorded_in_the_artifact

  - id: a-mis-set-threshold-would-abort-healthy-published-work
    adr: adr-0032-format-failure-circuit-breaker.md
    hazard: >
      A threshold or floor tightened without evidence would abort grids this project has already
      published — a guard that destroys good work is switched off, and then guards nothing. At a
      10-run floor the worst real prefix in the archive is 20.0%, exactly on a 20% threshold: no
      headroom at all.
    status: gated
    gated_by:
      - core/tests/test_run_guard.py::test_the_breaker_fires_on_no_archived_grid_this_project_published
      - core/tests/test_run_guard.py::test_the_floor_is_where_the_headroom_is
      - core/tests/test_run_guard.py::test_the_replay_above_is_not_vacuous

  - id: the-breaker-cannot-tell-a-broken-question-from-a-genuine-refusal
    adr: adr-0032-format-failure-circuit-breaker.md
    hazard: >
      A model can legitimately refuse when it genuinely does not know an obscure API, so a high
      cold-condition failure rate is evidence about the question, not proof. A breaker that RULED on
      it would suppress a real finding about a vendor.
    status: ungated
    ungated_reason: >
      Structurally undecidable from the rate alone. The mitigation is design rather than a test: the
      breaker stops the spend and demands a human ruling, deletes nothing, re-scores nothing, leaves
      the grid resumable, and records the threshold in force in `scores.json` so proceeding past a
      high rate is a decision on the permanent record.
    fix_queued_to: >
      Not queued, and recorded as not closable. Reading a failing transcript is the actual control,
      which is a practice rather than a test.

  - id: a-misleading-question-produces-confident-parseable-wrong-answers
    adr: adr-0032-format-failure-circuit-breaker.md
    hazard: >
      The breaker only sees UNPARSEABLE answers. A prompt that is misleading rather than
      unanswerable yields well-formed, confident, wrong answers at a 0% failure rate, and both this
      guard and ADR-0031's are blind to it. The breaker also sees one condition at a time, so the
      75%-to-0% ASYMMETRY that was the clearest signal is not what fires — only the absolute rate is.
    status: ungated
    ungated_reason: >
      Detecting it needs an oracle for what the right answer is, which is the ground truth the grid
      exists to test against. A cross-condition rule would need both conditions finished, which is
      after the spend the breaker exists to prevent.
    fix_queued_to: >
      Not queued. Recorded so the guard is not read as broader than it is.

  - id: a-rebuild-silently-deletes-a-disclosure-it-cannot-recompute
    adr: adr-0032-format-failure-circuit-breaker.md
    hazard: >
      `rebuild_report` assembles metadata from a whitelist, so any key not named in it is dropped. Three
      of those drops are deliberate and pinned (ADR-0002's run-provenance class). Two were not:
      `format_failure_threshold`, which ADR-0032 states is recorded "whether or not it fired" precisely
      so that publishing past a high failure rate is a decision on the permanent record, and
      `stopped_early`, the record that a grid is deliberately partial. Neither is recomputable from the
      run records, so a rebuild destroyed the only copy — and a re-score for integrity is exactly when
      an archive is most likely to be rebuilt. Found when a pack's two archives lost the threshold to a
      ground-truth correction, before either was committed.
    status: gated
    gated_by:
      - core/tests/test_rebuild_metadata.py::test_a_rebuild_carries_the_disclosure_forward
      - core/tests/test_rebuild_metadata.py::test_a_rebuild_does_not_invent_a_disclosure_that_was_never_recorded
      - core/tests/test_rebuild_metadata.py::test_the_documented_provenance_drops_still_drop

  - id: the-metadata-whitelist-has-no-general-rule
    adr: adr-0032-format-failure-circuit-breaker.md
    hazard: >
      The fix above names two keys. It does not establish a rule for which metadata a rebuild must
      preserve, so the next key added to a live run's metadata and not to that list is dropped the same
      way, silently, and the tests above will not notice. The distinction that matters — recomputable
      run provenance versus a disclosure that exists only because someone recorded it — is currently
      held in a comment rather than in the code.
    status: ungated
    ungated_reason: >
      A test asserting "every key a live run writes survives a rebuild" would be wrong: three keys are
      SUPPOSED to be dropped, and pinning the rest by enumeration recreates the same whitelist one
      layer up. The real fix is to classify metadata the way ADR-0033 classified run-record fields, and
      that is a change to how metadata is built rather than a test.
    fix_queued_to: >
      Filed as issue #57.

  - id: archived-run-records-go-stale-after-a-rebuild
    adr: adr-0032-format-failure-circuit-breaker.md
    hazard: >
      `rebuild-report` rewrote `scores.json` and `summary.md` but not `runs/*.json`, so every grid it
      re-scored kept the per-run scores the published number no longer counted. CLOSED by ADR-0033,
      which syncs the derived fields out of the committed report and into the records, and makes
      `rebuild-report` do the same going forward.

      THIS ENTRY UNDERSTATED THE HAZARD BY TWO ORDERS OF MAGNITUDE AND THE CORRECTION IS LEFT ON THE
      RECORD. It said "three archived conditions carry 8 such flags", counting only `format_failure`
      and only the `*/results/*` glob. Measured across all six derived fields and both globs: 24 of
      the 24 directories that had ever been rebuilt disagreed with their own report — 638 run records,
      929 fields. `format_failure` was 1% of it; stale `dimensions` (473 runs) and `endpoint_matches`
      (420 runs) were the rest.

      The claim that the direction was safe was also true only of this breaker. `cmd_run` resumes a
      grid by appending an archived record verbatim, so a stale record is re-published into a NEW
      scores.json — a live path to a wrong published number, not an inconsistency.
    status: gated
    gated_by:
      - core/tests/test_archive_consistency.py::test_every_run_record_agrees_with_its_own_report
      - core/tests/test_archive_consistency.py::test_the_check_above_actually_read_the_records
      - core/tests/test_archive_sync.py::test_scores_json_is_never_written
      - core/tests/test_archive_sync.py::test_the_sync_is_idempotent

  # ------------------------------------------------------------------------------ ADR-0033 ---

  - id: a-derived-field-nobody-classified-is-neither-protected-nor-synced
    adr: adr-0033-a-run-record-is-a-scored-record.md
    hazard: >
      The sync writes `DERIVED_FIELDS` and refuses to touch `TRANSPORT_FIELDS`. A field added to a run
      record and to neither list is silently outside both promises: it is not verified as evidence and
      it is never brought into agreement with the report.
    status: gated
    gated_by:
      - core/tests/test_archive_sync.py::test_every_field_a_live_run_writes_is_classified
      - core/tests/test_archive_sync.py::test_the_two_field_lists_do_not_overlap

  - id: reconciling-propagates-a-wrong-score-faithfully
    adr: adr-0033-a-run-record-is-a-scored-record.md
    hazard: >
      The sync makes a run record agree with the report built from it. It has no opinion about whether
      the report is right. If a scorer ruling was wrong, the reconciliation copies the wrong value into
      one more file and makes the archive internally consistent about it — which is harder to notice
      than a disagreement, because disagreement is a signal and agreement is not.
    status: ungated
    ungated_reason: >
      Detecting it requires knowing the correct score, which is the thing the scorer is for. The
      round-trip control (ADR-0010) has the same structural limit and states it in the same terms: an
      answer key always matches itself.
    fix_queued_to: >
      Not queued, and recorded as not closable by a test. The control is that a scorer ruling is
      re-applied to archives in the open, with the ADR that argued it.

  - id: the-older-scorers-per-run-opinion-survives-only-in-git-history
    adr: adr-0033-a-run-record-is-a-scored-record.md
    hazard: >
      Before ADR-0033 a rebuilt directory carried two independent per-run opinions — the report's
      current one and the record's older one — and the difference was recoverable by reading them
      against each other. After the sync only the current one is on disk. That second opinion is what
      made this hazard findable at all.
    status: ungated
    ungated_reason: >
      Keeping both would mean the archive states two different scores for one run with nothing saying
      which is published, which is the ambiguity the ruling exists to remove. The history is preserved
      in git rather than in the working tree.
    fix_queued_to: >
      Not queued. Recorded so the loss is deliberate rather than discovered later.

  - id: the-frozen-import-is-no-longer-byte-identical-to-its-source
    adr: adr-0033-a-run-record-is-a-scored-record.md
    hazard: >
      `packs/sailpoint/fixtures/imported/` was a byte-for-byte import from the frozen upstream repo,
      and PROVENANCE.md asserted it. One record's scorer-derived fields were regenerated, so that
      assertion is now narrower: the EVIDENCE is as imported, the record's copy of the score is not.
      A reader who takes the original claim at face value would be wrong.
    status: gated
    gated_by:
      - packs/sailpoint/tests/test_frozen_fixture_diff.py::test_the_regenerated_record_is_exactly_as_pinned
      - packs/sailpoint/tests/test_frozen_fixture_diff.py::test_the_raw_evidence_was_not_touched
      - packs/sailpoint/tests/test_frozen_fixture_diff.py::test_no_other_imported_record_was_regenerated
      - packs/sailpoint/tests/test_frozen_fixture_diff.py::test_the_provenance_note_records_the_regeneration

  - id: the-archive-sweep-is-silent-when-the-packs-dir-is-unset
    adr: adr-0033-a-run-record-is-a-scored-record.md
    hazard: >
      The consistency sweep enumerates `packs/` plus `$AIRE_PACKS_DIR`. With the variable unset it
      finds only the three in-repo fixtures and passes, having checked 3 of 32 directories — the same
      quiet-skip shape as the leak guard (ADR-0018) and the truncation sweep.
    status: gated
    gated_by:
      - core/tests/test_archive_consistency.py::test_the_sweep_below_is_not_vacuous

  # ------------------------------------------------------------------------------ ADR-0034 ---

  - id: an-anchor-is-checked-for-declaration-not-for-being-a-good-citation
    adr: adr-0034-an-anchor-is-not-an-injection.md
    hazard: >
      `check_anchoring` verifies that a cited URL was declared in the manifest and, via `fetch-docs`,
      that it was retrievable. It cannot tell whether the document at that URL actually documents the
      endpoint, is current, or describes the surface being measured. A pack anchored to a plausible
      but wrong first-party document passes the gate on a bad citation.
    status: ungated
    ungated_reason: >
      Verifying that a document supports a key means parsing arbitrary vendor documents and deciding
      whether they say what the key says — the judgement the whole method exists to make manually. The
      docs truncation audit does a narrow version of this for INJECTED pages only, and it deliberately
      does not require the docs to contain the answer.
    fix_queued_to: >
      Not queued. Review is the control, and each pack's specs.yaml records how its anchors were
      verified.

  - id: a-pack-may-cite-what-its-docs-condition-never-shows
    adr: adr-0034-an-anchor-is-not-an-injection.md
    hazard: >
      Splitting `anchors` from `pages` means a pack's ground truth can rest on an artifact the measured
      model is never given. That is the intended behaviour, and it is also a way to read a card wrongly:
      the `public-docs` column measures the vendor's REACHABLE documentation, not the corpus the answer
      key came from, and nothing in the numbers says so.
    status: ungated
    ungated_reason: >
      The disclosure is a sentence on a card, which no test can assert the meaning of. A test could
      require that a pack declaring `anchors` also carries some string in its report, which would check
      that a sentence exists rather than that it is true — coverage this registry exists to refuse.
    fix_queued_to: >
      Not queued. The ADR requires the disclosure and each affected pack's card carries it.


  # ---------------------------------------------------------------- ADR-0035 / ADR-0036 ---

  - id: no-gate-reads-pr-issue-or-commit-text
    adr: adr-0035-an-auto-closing-keyword-is-an-issue-state-action.md
    hazard: >
      The contract's rules about what a cycle may write in a PR body, a PR title, a commit message or
      an issue are enforced by nothing at all. Two guards exist and both are blind to this: one reads
      `git ls-files` (tracked file paths and content), the other `git for-each-ref` (branch names).
      The auto-closing-keyword ban, the prospect-naming rule as it applies to PR and issue text, and
      the base-branch rule are all in this blind spot together.
    status: ungated
    ungated_reason: >
      Checking it means reading GitHub metadata, which is network- and auth-dependent and would be the
      first such test in this repo. Every existing guard is a local, offline read. A test that skipped
      whenever `gh` was unavailable would report coverage it does not have, which is the failure this
      registry exists to catch.
    fix_queued_to: >
      Filed as core #59, alongside the standing #16 (make the base-branch rule enforceable). Both are
      the same shape — a rule about PR metadata that only prose currently holds.

  - id: an-auto-closing-keyword-changes-issue-state-at-merge
    adr: adr-0035-an-auto-closing-keyword-is-an-issue-state-action.md
    hazard: >
      `close`/`fix`/`resolve` before an issue reference performs an issue-state action the contract
      forbids, at merge time, in the author's name — and the write looks like a cross-reference at the
      moment it is made. It has fired once, on issue #52.
    status: ungated
    ungated_reason: >
      Same blind spot as the entry above: the text that would have to be read is not in the tree. The
      wording rule is in both repos' CLAUDE.md, which is where a cycle reads it, and that is the whole
      of the current control.
    fix_queued_to: >
      Filed as core #59. The check itself is trivial — a regex over the PR body — and the cost is
      entirely in the first network-dependent test.

  - id: a-manifest-may-name-a-page-its-host-disallows
    adr: adr-0036-robots-txt-is-a-fetch-permission.md
    hazard: >
      A pack could name any URL in `docs-manifest.yaml` and the fetcher would retrieve it, with nothing
      consulting the host's robots.txt. For the life of the project this was true of every pack: 271
      URLs across 16 hosts fetched without the question being asked once.
    status: gated
    gated_by:
      - core/tests/test_robots_annotations.py::test_no_pack_names_a_url_its_host_disallows
      - core/tests/test_robots_annotations.py::test_every_url_carries_a_complete_annotation

  - id: a-disallowed-url-could-still-be-fetched-or-injected
    adr: adr-0036-robots-txt-is-a-fetch-permission.md
    hazard: >
      Recording that a URL is Disallowed and declining to open it are different acts, and only the
      second is the ruling. Two routes could open one anyway: the fetcher requesting it, and — because
      an earlier fetch's snapshot survives in the cache — the condition injecting bytes from disk long
      after the host began refusing them.
    status: gated
    gated_by:
      - core/tests/test_robots_refusal.py::test_a_disallowed_url_is_never_requested
      - core/tests/test_robots_refusal.py::test_a_disallowed_page_never_reaches_a_built_prompt
      - core/tests/test_robots_refusal.py::test_fetch_all_consults_robots_when_no_policy_is_injected

  - id: a-robots-matcher-can-be-wrong-in-either-direction
    adr: adr-0036-robots-txt-is-a-fetch-permission.md
    hazard: >
      The verdict is only as good as the matcher, and a wrong one fails both ways: too permissive
      fetches what a host refused, too strict manufactures a violation. `urllib.robotparser` is wrong
      on both of the directive forms that forced this ruling, and the first cohort-wide run of this
      module reported eleven violations against a host that had merely stopped resolving.
    status: gated
    gated_by:
      - core/tests/test_robots.py::test_wildcard_and_anchor_forms
      - core/tests/test_robots.py::test_the_standard_library_would_disagree_which_is_why_this_module_exists
      - core/tests/test_robots.py::test_a_host_that_does_not_resolve_is_not_a_host_that_refused
      - core/tests/test_robots.py::test_a_dns_failure_and_a_connection_failure_are_told_apart_at_the_transport
      - core/tests/test_robots.py::test_unreachable_means_the_whole_host_is_disallowed

  - id: robots-annotations-go-stale-and-the-suite-cannot-tell
    adr: adr-0036-robots-txt-is-a-fetch-permission.md
    hazard: >
      The committed annotation is a dated snapshot of a host's instruction. A host that tightens its
      robots.txt after a pack was authored leaves every annotation reading `allowed` and every test
      green, because the standing sweep is deliberately offline and checks the record's completeness
      and internal consistency, never its currency.
    status: ungated
    ungated_reason: >
      Deliberate, and the same trade as the docs snapshot itself (ADR-0005). Making the sweep online
      would put sixteen vendors' uptime inside every test run, and a green suite would then mean the
      hosts answered rather than that we were permitted.
    fix_queued_to: >
      Not queued as a code change — `annotate-robots --check` is the refresh and re-reads every host,
      so the drift is detectable on demand. What is unqueued is a cadence for running it; it belongs
      with the docs re-snapshot, which has the same staleness property and the same answer.
