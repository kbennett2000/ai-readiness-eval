id: widget-create
category: foundational
job_category: policy-object-create-and-test
prompt: How do I create a widget in Acme Widget Cloud?
ground_truth:
  endpoints:
    - method: POST
      path: /v3/widgets
      api_version: v3
      operation_id: createWidget
      spec_ref: { file: widgets/v3/paths/widgets.yaml, operation_id: createWidget }
  auth_flow: OAuth2 bearer token
  required_scopes:
    - "widgets:write"
  key_parameters:
    - { name: name, in: body, required: true }
  success_shape: 201 Created with the new widget.
  common_failure_modes:
    - Missing the widgets:write scope.
